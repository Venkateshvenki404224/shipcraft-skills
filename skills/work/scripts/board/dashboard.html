<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f7f9;--surface:#fff;--surface-2:#f1f3f6;--border:#e3e6eb;--text:#14181f;--muted:#5d6675;--faint:#8a93a2;
  --brand:#0f766e;--on-brand:#fff;--brand-soft:#e6f4f2;--blue:#2563eb;--blue-soft:#e8effd;--amber:#b45309;--amber-soft:#fdf3e4;
  --red:#b91c1c;--red-soft:#fdecec;--green:#15803d;--green-soft:#e7f6ec;--pink:#be185d;--pink-soft:#fce7f3;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);--scrim:rgba(15,20,30,.35);
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1117;--surface:#151b23;--surface-2:#1c232d;--border:#2a323d;--text:#e6e9ee;--muted:#9aa4b2;--faint:#6e7886;
  --brand:#2dd4bf;--on-brand:#0d1117;--brand-soft:#11302d;--blue:#60a5fa;--blue-soft:#14233b;--amber:#fbbf24;--amber-soft:#33270f;
  --red:#f87171;--red-soft:#3a1717;--green:#4ade80;--green-soft:#12301d;--pink:#f472b6;--pink-soft:#3a1530;--shadow:none;--scrim:rgba(0,0,0,.55);}}
:root[data-theme="dark"]{
  --bg:#0d1117;--surface:#151b23;--surface-2:#1c232d;--border:#2a323d;--text:#e6e9ee;--muted:#9aa4b2;--faint:#6e7886;
  --brand:#2dd4bf;--on-brand:#0d1117;--brand-soft:#11302d;--blue:#60a5fa;--blue-soft:#14233b;--amber:#fbbf24;--amber-soft:#33270f;
  --red:#f87171;--red-soft:#3a1717;--green:#4ade80;--green-soft:#12301d;--pink:#f472b6;--pink-soft:#3a1530;--shadow:none;--scrim:rgba(0,0,0,.55);}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}
button{font:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:1360px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;gap:12px;align-items:center;min-width:0}
.mark{width:38px;height:38px;border-radius:10px;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;flex:none;font-weight:700;font-size:14px}
h1{font-size:19px;margin:0;letter-spacing:-.01em;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;position:relative}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);padding:5px 10px;border:1px solid var(--border);border-radius:999px;background:var(--surface)}
.live .dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft)}
.live.error{color:var(--red)}.live.error .dot{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.live.snap .dot{background:var(--faint);box-shadow:none}
.btn{font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:var(--surface-2)}
.kbd{font-family:var(--mono);font-size:10.5px;color:var(--faint);border:1px solid var(--border);border-radius:4px;padding:0 4px}
.banner{background:var(--red-soft);color:var(--red);border:1px solid color-mix(in srgb,var(--red) 30%,var(--border));border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:6px}
.kpi{padding:14px 16px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-size:24px;font-weight:600;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .v.sm{font-size:16px;margin-top:8px}
.kpi .h{font-size:12px;color:var(--faint)}
.kpi.turn{border-color:color-mix(in srgb,var(--pink) 45%,var(--border));background:color-mix(in srgb,var(--pink-soft) 60%,var(--surface))}
.kpi.turn .v{color:var(--pink)}
.section-title{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:22px 2px 10px}
.stepper{display:grid;grid-template-columns:repeat(var(--n,9),minmax(0,1fr));padding:16px;row-gap:18px}
.step{position:relative;padding:0 6px;text-align:center;cursor:pointer;border-radius:8px}
.step:hover .t{color:var(--brand)}
.step:before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--border);z-index:0}
.step:first-child:before{display:none}
.step.done:before,.step.active:before,.step.wait:before,.step.issue:before{background:var(--brand)}
.bubble{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-size:12px;font-weight:600;background:var(--surface);border:2px solid var(--border);color:var(--faint)}
.step.done .bubble{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.step.active .bubble{border-color:var(--brand);color:var(--brand);animation:pulse 1.6s infinite}
.step.wait .bubble{border-color:var(--pink);background:var(--pink);color:#fff;animation:pulseP 1.6s infinite}
.step.issue .bubble{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.step.sel .t{text-decoration:underline;text-underline-offset:3px}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--brand) 40%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
@keyframes pulseP{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--pink) 45%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.step .t{font-size:12.5px;font-weight:600}
.step .d{font-size:11.5px;color:var(--muted);line-height:1.35;margin-top:2px}
.step .c{font-size:11px;color:var(--faint);margin-top:4px}
.grid2{display:grid;grid-template-columns:320px minmax(0,1fr);gap:16px}
.roles{padding:6px;align-self:start}
.role{display:flex;gap:10px;padding:10px;border-radius:10px;cursor:pointer;align-items:flex-start;width:100%;text-align:left;background:none;border:0}
.role:hover,.role.sel{background:var(--surface-2)}
.avatar{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none;background:var(--brand-soft);color:var(--brand)}
.role .n{font-weight:600;font-size:13.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.role .d{font-size:12px;color:var(--muted)}
.counts{font-size:11.5px;color:var(--faint);margin-top:2px}
.tag{white-space:nowrap;font-size:11px;font-weight:500;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.tbl-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border);gap:10px;flex-wrap:wrap}
.tbl-head h3{margin:0;font-size:14px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer}
.chip.on{background:var(--text);color:var(--surface);border-color:var(--text)}
.chip .n{opacity:.7;margin-left:3px}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:11.5px;color:var(--faint);text-align:left;font-weight:500;padding:8px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:10px 14px;border-bottom:1px solid var(--border);vertical-align:top;font-size:13px}
.tbl tr.row{cursor:pointer}
.tbl tr.row:hover td,.tbl tr.row:focus-visible td{background:var(--surface-2);outline:none}
.tbl .t1{font-weight:500}
.tbl .t2{color:var(--muted);font-size:12px}
.tbl .last{color:var(--faint);font-size:11.5px;font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:520px;margin-top:2px}
.num{font-family:var(--mono);font-size:12px;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.running{background:var(--blue-soft);color:var(--blue)}
.pill.done{background:var(--green-soft);color:var(--green)}
.pill.issue{background:var(--red-soft);color:var(--red)}
.pill.changes{background:var(--amber-soft);color:var(--amber)}
.pill.wait{background:var(--pink-soft);color:var(--pink)}
.pill.queued,.pill.skipped{background:var(--surface-2);color:var(--muted)}
.spin{width:9px;height:9px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .9s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.muted{color:var(--muted)}
.empty{padding:40px;text-align:center;color:var(--faint)}
.evid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.ev{padding:14px 16px;cursor:pointer;text-align:left;border:1px solid var(--border);background:var(--surface);border-radius:12px;box-shadow:var(--shadow)}
.ev:hover{background:var(--surface-2)}
.ev .l{font-size:12px;color:var(--muted)}
.ev .v{font-size:16px;font-weight:600;margin-top:2px}
.ev .h{font-size:12px;color:var(--faint)}
.ev.warn{border-color:color-mix(in srgb,var(--amber) 45%,var(--border))}.ev.warn .v{color:var(--amber)}
.ev.todo{border-color:color-mix(in srgb,var(--pink) 45%,var(--border))}.ev.todo .v{color:var(--pink)}
.ev.good .v{color:var(--green)}
.docs{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:420px}
.doclist{border-right:1px solid var(--border);padding:8px;max-height:720px;overflow:auto}
.docitem{padding:8px 10px;border-radius:8px;cursor:pointer;display:block;width:100%;text-align:left;background:none;border:0}
.docitem:hover,.docitem.sel{background:var(--surface-2)}
.docitem .t{font-size:13px;font-weight:500}
.docitem .p{font-size:11.5px;color:var(--faint);overflow-wrap:anywhere}
.viewer{padding:6px 28px 28px;max-height:720px;overflow:auto;min-width:0}
footer{margin-top:22px;font-size:11.5px;color:var(--faint);display:flex;gap:20px;flex-wrap:wrap}
/* run picker */
.pop{position:absolute;right:0;top:calc(100% + 6px);width:min(440px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);z-index:20;padding:8px}
.pop input{width:100%;font:inherit;font-size:13px;padding:7px 10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);margin-bottom:6px}
.pop-list{max-height:60vh;overflow:auto}
.pop-sec{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin:8px 8px 4px}
.run-row{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 8px;cursor:pointer}
.run-row:hover,.run-row.kb,.run-row.on{background:var(--surface-2)}
.run-row .nm{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.run-row .ago{font-size:11.5px;color:var(--faint)}
.run-row .sb{grid-column:2/4;font-size:11.5px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.sdot.running{background:var(--blue)}.sdot.waiting{background:var(--pink)}.sdot.finished{background:var(--green)}.sdot.failed{background:var(--red)}
.pop-empty{padding:16px;color:var(--faint);text-align:center}
/* drawer */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(920px,100vw);z-index:31;background:var(--surface);border-left:1px solid var(--border);display:grid;grid-template-rows:auto 1fr;transform:translateX(100%);transition:transform .25s ease;box-shadow:-12px 0 32px rgba(0,0,0,.12)}
.open .scrim{opacity:1;pointer-events:auto}
.open .drawer{transform:none}
.ui-open .drawer{width:min(1480px,100vw)}
.ui-open .d-body{grid-template-columns:320px 1fr}
.d-head{padding:18px 24px 14px;border-bottom:1px solid var(--border);position:relative}
.d-head .dn{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.d-head h3{margin:4px 44px 6px 0;font-size:16px;font-weight:600;line-height:1.35}
.d-deps{display:grid;gap:4px;font-size:11.5px;color:var(--faint)}
.d-deps>div{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.d-deps .k{width:64px;font-family:var(--mono)}
.dep{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted);cursor:pointer}
.dep.done{color:var(--green)}.dep.running{color:var(--blue)}.dep.wait{color:var(--pink)}.dep.issue{color:var(--red)}
.close{position:absolute;top:14px;right:16px;width:32px;height:32px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
.close:hover{color:var(--text)}
.d-body{display:grid;grid-template-columns:220px 1fr;min-height:0}
.files{border-right:1px solid var(--border);padding:12px 8px;overflow-y:auto}
.files .group{color:var(--faint);margin:12px 8px 4px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.files .group:first-child{margin-top:0}
.file{display:flex;align-items:flex-start;overflow-wrap:anywhere;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:6px 8px;cursor:pointer;font-size:12.5px;color:var(--muted)}
.file:hover{background:var(--surface-2);color:var(--text)}
.file.on{background:var(--brand-soft);color:var(--brand);font-weight:500}
.file .v{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none;margin-top:6px}
.v.good{background:var(--green)}.v.warn{background:var(--amber)}.v.stop{background:var(--red)}.v.todo{background:var(--pink)}
.doc{overflow-y:auto;padding:22px 28px 60px;min-width:0}
/* markdown */
.md{max-width:760px;line-height:1.65}
.md h1,.md h2,.md h3,.md h4{line-height:1.3;margin:1.5em 0 .5em}
.md h1{font-size:20px}.md h2{font-size:16px;padding-top:10px;border-top:1px solid var(--border)}.md h3{font-size:14px}.md h4{font-size:13px;color:var(--muted)}
.md>:first-child{margin-top:0}
.md p,.md ul,.md ol,.md blockquote,.md pre,.md table{margin:0 0 .9em}
.md ul,.md ol{padding-left:1.3em}
.md li{margin:.2em 0}
.md li.task{list-style:none;margin-left:-1.3em}
.md li.task::before{content:"☐";margin-right:.5em;color:var(--faint)}
.md li.task.done::before{content:"☑";color:var(--green)}
.md code{font-family:var(--mono);font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.md pre{background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;overflow-x:auto}
.md pre code{background:none;padding:0}
.md blockquote{margin-left:0;padding:6px 14px;border-left:3px solid var(--brand);background:var(--brand-soft);border-radius:4px}
.md table{border-collapse:collapse;font-size:12.5px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--border);padding:5px 9px;text-align:left;vertical-align:top}
.md th{background:var(--surface-2)}
.verdict{display:inline-block;font-family:var(--mono);font-size:12px;font-weight:600;padding:4px 10px;border-radius:6px;margin-bottom:14px}
.md .head{font-family:var(--mono);font-size:12px;color:var(--muted);margin:-6px 0 14px;white-space:pre-line}
.verdict.good{color:var(--green);background:var(--green-soft)}.verdict.warn{color:var(--amber);background:var(--amber-soft)}.verdict.stop{color:var(--red);background:var(--red-soft)}
/* UI before/after + videos */
.uiv{min-width:0}
.ui-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:10px}
.ui-meta b{color:var(--text);font-weight:600}
.ui-flag{font-size:12.5px;color:var(--amber);margin:0 0 10px}
.ui-note{font-size:13px;margin:0 0 12px}
.ui-note .verdict{margin:0 8px 0 0;padding:2px 8px;font-size:11.5px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;margin:2px 0 14px}
.seg button{border:0;background:var(--surface);padding:5px 12px;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--text);color:var(--surface)}
.seg button[disabled]{opacity:.4;cursor:default}
.ui-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.ui-pair figure{margin:0;min-width:0}
.ui-pair figcaption,.ui-cap{font-size:11.5px;color:var(--muted);margin-bottom:6px}
.ui-cap{display:flex;justify-content:space-between}
.ui-img img{display:block;width:100%;height:auto;border:1px solid var(--border);border-radius:8px;background:#fff}
.ui-none{border:1px dashed var(--border);border-radius:8px;padding:48px 12px;text-align:center;color:var(--faint);font-size:12.5px}
.ui-slide{position:relative;border:1px solid var(--border);border-radius:8px;overflow:hidden;user-select:none;background:#fff}
.ui-slide img{display:block;width:100%;height:auto}
.ui-slide img.b{position:absolute;top:0;left:0;clip-path:inset(0 calc(100% - var(--split)) 0 0)}
.ui-slide .ui-split{position:absolute;top:0;bottom:0;left:var(--split);width:2px;background:var(--brand);transform:translateX(-1px);pointer-events:none}
.ui-slide input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.state{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.vid-player{display:block;width:100%;max-height:70vh;background:#000;border:1px solid var(--border);border-radius:8px}
.vid-sheet{margin-top:16px}
.vid-sheet img{display:block;width:100%;height:auto;border:1px solid var(--border);border-radius:8px}
@media (prefers-reduced-motion:reduce){.spin,.step .bubble{animation:none!important}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2{grid-template-columns:1fr}.stepper{grid-template-columns:repeat(min(var(--n,9),5),minmax(0,1fr))}.step:nth-child(5n+1):before{display:none}}
@media (max-width:720px){.docs{grid-template-columns:1fr}.doclist{border-right:0;border-bottom:1px solid var(--border);max-height:220px}.stepper{grid-template-columns:repeat(2,minmax(0,1fr))}.step:before{display:none}.tbl .hide-sm{display:none}.viewer{padding:6px 14px 20px}
  .d-head{padding:16px}.d-body{grid-template-columns:1fr;grid-template-rows:auto 1fr}.files{border-right:0;border-bottom:1px solid var(--border);display:flex;gap:4px;overflow-x:auto;padding:8px}.files .group{display:none}.file{width:auto;white-space:nowrap}.doc{padding:18px 16px 48px}.ui-pair{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark" id="mark">W</div>
      <div style="min-width:0">
        <h1 id="title">Run board</h1>
        <div class="sub" id="subtitle">connecting…</div>
      </div>
    </div>
    <div class="controls">
      <span class="live" id="status"><span class="dot"></span>connecting…</span>
      <button class="btn" id="run-btn" aria-haspopup="listbox" aria-expanded="false" title="Switch run (R)"><span class="sdot" id="run-btn-dot"></span><span id="run-btn-name">Runs</span><span class="kbd">R</span></button>
      <button class="btn" id="toggleTheme">Theme</button>
      <div class="pop" id="run-pop" hidden>
        <input id="run-q" placeholder="Filter runs…" autocomplete="off" aria-label="Filter runs">
        <div class="pop-list" id="run-list" role="listbox"></div>
      </div>
    </div>
  </header>
  <div id="banner"></div>
  <div class="kpis" id="kpis"></div>

  <div class="section-title">Workflow</div>
  <div class="card stepper" id="stepper"></div>

  <div class="section-title">Team &amp; agents</div>
  <div class="grid2">
    <div class="card roles" id="roles"></div>
    <div class="card" style="min-width:0">
      <div class="tbl-head"><h3 id="agentsTitle">All steps</h3><div class="filters" id="filters"></div></div>
      <div style="overflow:auto"><table class="tbl" id="agents"></table></div>
    </div>
  </div>

  <div id="evBlock" hidden>
    <div class="section-title">Evidence</div>
    <div class="evid" id="evid"></div>
  </div>

  <div id="docsBlock" hidden>
    <div class="section-title">Deliverables</div>
    <div class="card docs">
      <div class="doclist" id="doclist"></div>
      <div class="viewer"><div class="md" id="viewer"><div class="empty">Select a document</div></div></div>
    </div>
  </div>

  <footer>
    <span>Keys: R runs · Esc close · click a step or a row for its prompt, activity and result</span>
    <span>Cost is API-equivalent at list prices (estimated).</span>
  </footer>
</div>

<div id="overlay">
  <div class="scrim" data-close></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <div class="d-head">
      <div class="dn" id="d-num"></div>
      <h3 id="d-title"></h3>
      <div class="d-deps" id="d-deps"></div>
      <button class="close" data-close aria-label="Close">×</button>
    </div>
    <div class="d-body">
      <nav class="files" id="d-files"></nav>
      <article class="doc"><div class="md" id="d-doc"></div></article>
    </div>
  </aside>
</div>

<script>
const POLL_MS = 2000
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const store = {
  get(k, d) { try { const v = localStorage.getItem('wfboard.' + k); return v === null ? d : JSON.parse(v) } catch { return d } },
  set(k, v) { try { localStorage.setItem('wfboard.' + k, JSON.stringify(v)) } catch {} },
}
let state = null
let runId = store.get('runid', null)
const prefs = { filter: 'all', role: '', phase: '' }
let model = null
let open = null, openFile = null, openText
let docSel = null, docText
let lastSig = ''

// wfboard.py --snapshot inlines every file as window.BOARD_SNAPSHOT (a cloud session has no localhost to poll).
const SNAP = window.BOARD_SNAPSHOT || null
async function fetchText(url) {
  if (SNAP) {
    if (url in SNAP.files) return SNAP.files[url]
    throw new Error(`${url}: not in this snapshot`)
  }
  const res = await fetch(url, { cache: 'no-store' })
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`)
  return res.text()
}

// theme
const theme = store.get('theme', null)
if (theme) document.documentElement.dataset.theme = theme
$('toggleTheme').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
  const n = cur === 'dark' ? 'light' : 'dark'
  document.documentElement.dataset.theme = n
  store.set('theme', n)
}

function dur(sec) {
  sec = Math.max(0, sec || 0)
  if (sec < 60) return `${Math.round(sec)}s`
  if (sec < 3600) return `${Math.floor(sec / 60)}m ${String(Math.round(sec % 60)).padStart(2, '0')}s`
  return `${Math.floor(sec / 3600)}h ${Math.floor(sec % 3600 / 60)}m`
}
function ago(t) {
  if (!t) return ''
  const s = Date.now() / 1000 - t
  if (s < 60) return 'just now'
  if (s < 3600) return `${Math.floor(s / 60)} min ago`
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`
  return `${Math.floor(s / 86400)} days ago`
}
const money = (n) => `$${Number(n || 0).toFixed(2)}`
const initials = (n) => String(n || '').split(/[\s/·_\-:]+/).filter((w) => w && /[A-Za-z0-9]/.test(w[0])).slice(0, 2).map((w) => w[0]).join('').toUpperCase() || '•'
const cap = (s) => String(s || '').replace(/^\w/, (c) => c.toUpperCase())

// ---- status categories ----
const CATS = ['running', 'wait', 'issue', 'done', 'queued', 'skipped']
const CAT_LABEL = { running: 'Running', wait: 'Your turn', issue: 'Needs a look', done: 'Done', queued: 'Queued', skipped: 'Skipped' }
function cat(g) {
  if (g.running || g.status === 'RUN') return 'running'
  if (g.status === 'WAIT') return 'wait'
  if (['PASS', 'DONE'].includes(g.status)) return 'done'
  if (['FAIL', 'CHANGES'].includes(g.status)) return 'issue'
  if (g.status === 'TODO') return 'queued'
  return 'skipped'
}
const STATUS_WORD = { RUN: 'running', PASS: 'pass', CHANGES: 'changes', FAIL: 'failed', DONE: 'done', STOPPED: 'stopped', WAIT: 'waiting on you', TODO: 'not started', SKIP: 'not run' }
function pill(g) {
  const c = cat(g)
  if (c === 'running') return '<span class="pill running"><span class="spin"></span>Running</span>'
  if (c === 'wait') return '<span class="pill wait">◆ Your turn</span>'
  if (c === 'done') return `<span class="pill done">${g.status === 'PASS' ? 'Passed' : 'Done'}</span>`
  if (c === 'issue') return g.status === 'FAIL' ? '<span class="pill issue">Failed</span>' : '<span class="pill changes">Changes</span>'
  if (c === 'queued') return '<span class="pill queued">Queued</span>'
  return `<span class="pill skipped">${g.status === 'SKIP' ? 'Not run' : 'Stopped'}</span>`
}
function runCat(r) { const s = (r.state || '').split(' ')[0]; return s === 'waiting' ? 'waiting' : s }
const ACTIVE_RUN = new Set(['running', 'between', 'waiting'])
function currentRun() {
  if (!state?.runs?.length) return null
  return state.runs.find((r) => r.id === runId) || state.runs[0]
}
const realGroups = (run) => run.groups.filter((g) => g.id !== 'Orchestrator/main')
const isPipeline = (run) => String(run.id).startsWith('pl_')
// Who did it. A workflow run labels agents "<Role>: <task>"; a /work pipeline step records its agent type
// (architect, verifier, qa ...) in the model field. Real model names go to the Models column instead.
const MODEL_RX = /opus|sonnet|haiku|fable|claude/i
function roleOf(run, g) {
  const a = g.agents[g.agents.length - 1] || {}
  if (isPipeline(run)) return cap(a.model && !MODEL_RX.test(a.model) ? a.model : (a.step || g.phase || 'Agent')).replace(/\s+\d+$/, '')
  return (a.step || (g.title || '').split(':')[0] || 'Agents').replace(/\s+\d+$/, '').trim()
}
const modelsOf = (g) => [...new Set(g.agents.map((a) => a.model).filter((m) => m && MODEL_RX.test(m)))].map(cap)
const cost = (n) => n ? money(n) : '–'

// ---- dependency model (for "after" / "unblocks" in the drawer) ----
function buildModel(run) {
  const gs = realGroups(run)
  const byId = new Map(gs.map((g) => [g.id, g]))
  const resolve = (d) => byId.get(d) || gs.find((g) => g.key === d) || gs.find((g) => g.num === d)
  const parents = new Map(gs.map((g) => [g.id, new Set()]))
  for (const g of gs) for (const d of g.deps || []) { const p = resolve(d); if (p && p.id !== g.id) parents.get(g.id).add(p.id) }
  const children = new Map(gs.map((g) => [g.id, new Set()]))
  for (const [c, ps] of parents) for (const p of ps) children.get(p)?.add(c)
  return { byId, up: (id) => [...(parents.get(id) || [])], down: (id) => [...(children.get(id) || [])] }
}
function depChips(ids) {
  return ids.map((id) => { const g = model.byId.get(id); if (!g) return ''; const c = cat(g)
    return `<button class="dep ${c}" data-group="${esc(id)}" title="${esc(g.title)}">${c === 'done' ? '✓ ' : c === 'running' ? '● ' : ''}${esc(g.num)}</button>` }).join('')
}

// ---- run picker ----
let popIndex = -1
function runRows() {
  const q = $('run-q').value.trim().toLowerCase()
  const runs = (state?.runs || []).filter((r) => !q || `${r.name} ${r.id} ${r.state}`.toLowerCase().includes(q))
  const byTime = (a, b) => (b.updated || 0) - (a.updated || 0)
  return { live: runs.filter((r) => ACTIVE_RUN.has(runCat(r))).sort(byTime), rest: runs.filter((r) => !ACTIVE_RUN.has(runCat(r))).sort(byTime) }
}
function renderRunPicker() {
  const run = currentRun()
  if (run) { $('run-btn-name').textContent = (state.runs.length > 1 ? `${state.runs.length} runs` : 'Run'); $('run-btn-dot').className = `sdot ${runCat(run)}` }
  if ($('run-pop').hidden) return
  const { live, rest } = runRows()
  const row = (r) => {
    const gs = realGroups(r), done = gs.filter((g) => cat(g) === 'done').length
    return `<button class="run-row ${run && r.id === run.id ? 'on' : ''}" role="option" data-run="${esc(r.id)}"><span class="sdot ${runCat(r)}"></span><span class="nm">${esc(r.name)}</span><span class="ago">${esc(ago(r.updated))}</span>
      <span class="sb"><span>${esc(r.state)}</span><span>${done}/${gs.length} done</span><span>${money(r.cost)}</span></span></button>`
  }
  $('run-list').innerHTML = ((live.length ? `<div class="pop-sec">Active now · ${live.length}</div>${live.map(row).join('')}` : '')
    + (rest.length ? `<div class="pop-sec">Earlier</div>${rest.map(row).join('')}` : '')) || '<div class="pop-empty">No runs match.</div>'
  markKb()
}
function markKb() { const rows = [...$('run-list').querySelectorAll('.run-row')]; rows.forEach((r, i) => r.classList.toggle('kb', i === popIndex)); rows[popIndex]?.scrollIntoView({ block: 'nearest' }) }
function openPop() { $('run-pop').hidden = false; $('run-btn').setAttribute('aria-expanded', 'true'); $('run-q').value = ''; popIndex = -1; renderRunPicker(); $('run-q').focus() }
function closePop() { $('run-pop').hidden = true; $('run-btn').setAttribute('aria-expanded', 'false') }
function selectRun(id) {
  runId = id; store.set('runid', id)
  prefs.filter = 'all'; prefs.role = ''; prefs.phase = ''; docSel = null; docText = undefined; lastSig = ''
  closePop(); closeDrawer(); render()
}

// ---- page ----
function phaseState(gs) {
  if (!gs.length) return 'pending'
  const cs = gs.map(cat)
  if (cs.includes('wait')) return 'wait'
  if (cs.includes('running')) return 'active'
  if (cs.includes('issue')) return 'issue'
  if (cs.every((c) => c === 'done' || c === 'skipped')) return cs.includes('done') ? 'done' : 'pending'
  return cs.some((c) => c === 'done') ? 'active' : 'pending'
}

function render() {
  renderRunPicker()
  const run = currentRun()
  if (!run) { $('title').textContent = 'Run board'; $('subtitle').textContent = 'No workflow runs found yet.'; return }
  model = buildModel(run)
  const gs = realGroups(run)
  const agents = run.groups.flatMap((g) => g.agents)
  const running = gs.filter((g) => cat(g) === 'running')
  const waiting = gs.filter((g) => cat(g) === 'wait')
  const done = gs.filter((g) => cat(g) === 'done')
  const issues = gs.filter((g) => cat(g) === 'issue')
  document.title = `${run.running ? '● ' : waiting.length ? '◆ ' : ''}${run.name} · Run board`
  $('mark').textContent = initials(run.name)
  $('title').textContent = run.name
  $('subtitle').innerHTML = [esc(run.state), isPipeline(run) ? '/work pipeline' : 'workflow run', `started ${esc(ago(run.started))}`, `elapsed ${dur(run.elapsed)}`, money(run.cost) + ' est.']
    .map((s, i) => (i ? '· ' : '') + s).join(' ')
  $('banner').innerHTML = run.error ? `<div class="banner">${esc(run.error)}</div>` : ''

  // KPIs
  const phases = (run.phases && run.phases.length ? run.phases : [...new Set(gs.map((g) => g.phase))])
  const pstates = phases.map((p) => [p, phaseState(gs.filter((g) => g.phase === p))])
  const cur = pstates.find(([, s]) => s === 'wait') || pstates.find(([, s]) => s === 'active') || pstates.find(([, s]) => s === 'issue')
  const pdone = pstates.filter(([, s]) => s === 'done').length
  const models = [...new Set(agents.map((a) => a.model).filter((m) => m && MODEL_RX.test(m)))].map(cap).join(' · ') || '–'
  const tok = agents.reduce((n, a) => n + (a.tokens_out || 0), 0)
  const k = [
    ['card kpi', 'Steps done', `${done.length} / ${gs.length}`, running.length ? `${running.length} running now` : issues.length ? `${issues.length} need a look` : 'idle'],
    ['card kpi', 'Current stage', cur ? cur[0] : (pdone === phases.length && phases.length ? 'Complete' : 'Waiting'), `${pdone} of ${phases.length} stages done`],
    [waiting.length ? 'card kpi turn' : 'card kpi', 'Your turn', waiting.length ? waiting.map((g) => g.num || g.title).join(', ') : 'Nothing', waiting.length ? waiting.map((g) => g.title).join(' · ') : 'no gate is waiting on you'],
    ['card kpi', 'Models', models, `${agents.length} agents, from transcripts`],
    ['card kpi', 'Cost (est.)', money(run.cost), tok ? `${tok.toLocaleString()} output tokens` : 'API list prices'],
  ]
  $('kpis').innerHTML = k.map(([cls, l, v, h]) => `<div class="${cls}"><div class="l">${esc(l)}</div><div class="v ${String(v).length > 14 ? 'sm' : ''}">${esc(v)}</div><div class="h">${esc(h)}</div></div>`).join('')

  // stepper
  const st = $('stepper')
  st.style.setProperty('--n', Math.max(1, Math.min(phases.length, 10)))
  st.innerHTML = pstates.map(([p, s], i) => {
    const pg = gs.filter((g) => g.phase === p)
    const pd = pg.filter((g) => cat(g) === 'done').length
    const bub = s === 'done' ? '✓' : s === 'wait' ? '◆' : s === 'issue' ? '!' : i + 1
    const words = pg.length ? [...new Set(pg.map((g) => isPipeline(run) ? (g.title || g.num) : roleOf(run, g)))].slice(0, 3).join(', ') : ''
    return `<div class="step ${s} ${prefs.phase === p ? 'sel' : ''}" data-phase="${esc(p)}" title="Show only this stage"><div class="bubble">${bub}</div><div class="t">${esc(p)}</div><div class="d">${esc(words)}</div><div class="c">${pg.length ? `${pd}/${pg.length} steps` : '&nbsp;'}</div></div>`
  }).join('') || '<div class="empty">No stages yet.</div>'

  renderRoles(run, gs)
  renderTable(run, gs)
  renderEvidence(run)
  renderDocs(run)
}

function renderRoles(run, gs) {
  const roles = []
  for (const g of gs) { const r = roleOf(run, g); if (!roles.includes(r)) roles.push(r) }
  const orch = run.groups.find((g) => g.id === 'Orchestrator/main')
  $('roles').innerHTML = `<button class="role ${prefs.role ? '' : 'sel'}" data-role=""><div class="avatar" style="background:var(--surface-2);color:var(--muted)">All</div><div><div class="n">Whole team</div>
      <div class="d">You (owner) · Claude (orchestrator${orch ? ', ' + esc(cap(orch.agents[0]?.model || '')) : ''})</div><div class="counts">${gs.length} steps · ${run.groups.reduce((n, g) => n + g.agents.length, 0)} agents</div></div></button>`
    + roles.map((r) => {
      const mine = gs.filter((g) => roleOf(run, g) === r)
      const rn = mine.filter((g) => cat(g) === 'running').length, wn = mine.filter((g) => cat(g) === 'wait').length
      const dn = mine.filter((g) => cat(g) === 'done').length, fn = mine.filter((g) => cat(g) === 'issue').length
      const ms = [...new Set(mine.flatMap(modelsOf))]
      return `<button class="role ${prefs.role === r ? 'sel' : ''}" data-role="${esc(r)}"><div class="avatar">${esc(initials(r))}</div><div style="min-width:0">
        <div class="n">${esc(r)} ${ms.map((m) => `<span class="tag">${esc(m)}</span>`).join('')}${rn ? `<span class="pill running"><span class="spin"></span>${rn}</span>` : ''}${wn ? '<span class="pill wait">your turn</span>' : ''}</div>
        <div class="counts">${dn} done · ${rn} running${fn ? ` · ${fn} need a look` : ''}${(() => { const c = mine.reduce((n, g) => n + (g.cost || 0), 0); return c ? ' · ' + money(c) : '' })()}</div></div></button>`
    }).join('')
}

function renderTable(run, gs) {
  const c = Object.fromEntries(CATS.map((k) => [k, gs.filter((g) => cat(g) === k).length]))
  $('filters').innerHTML = `<button class="chip ${prefs.filter === 'all' ? 'on' : ''}" data-filter="all">All<span class="n">${gs.length}</span></button>`
    + CATS.filter((k) => c[k]).map((k) => `<button class="chip ${prefs.filter === k ? 'on' : ''}" data-filter="${k}">${CAT_LABEL[k]}<span class="n">${c[k]}</span></button>`).join('')
  $('agentsTitle').textContent = [prefs.role || 'All steps', prefs.phase && `stage ${prefs.phase}`].filter(Boolean).join(' · ')
  const order = { wait: 0, running: 1, issue: 2, queued: 3, done: 4, skipped: 5 }
  const phases = run.phases || []
  const list = gs.filter((g) => (prefs.filter === 'all' || cat(g) === prefs.filter) && (!prefs.role || roleOf(run, g) === prefs.role) && (!prefs.phase || g.phase === prefs.phase))
    .sort((a, b) => order[cat(a)] - order[cat(b)] || (isPipeline(run) ? phases.indexOf(a.phase) - phases.indexOf(b.phase) : (b.started || 0) - (a.started || 0)))
  if (!list.length) { $('agents').innerHTML = '<tr><td class="empty">Nothing here yet</td></tr>'; return }
  $('agents').innerHTML = '<tr><th>Status</th><th>Step</th><th class="hide-sm">Role</th><th class="hide-sm">Model</th><th class="hide-sm">Cost</th><th>Time</th></tr>'
    + list.map((g) => {
      const a = g.agents.length
      const showLast = cat(g) === 'running' && g.last
      return `<tr class="row" tabindex="0" data-group="${esc(g.id)}"><td>${pill(g)}</td>
        <td><div class="t1">${esc(g.title)}${a > 1 ? ` <span class="tag" title="agents or attempts in this step">${a} agents</span>` : ''}</div><div class="t2">${esc(g.phase)}${g.num ? ' · ' + esc(g.num) : ''}</div>${showLast ? `<div class="last">${esc(g.last)}</div>` : ''}</td>
        <td class="hide-sm">${esc(roleOf(run, g))}</td><td class="hide-sm">${modelsOf(g).map((m) => `<span class="tag">${esc(m)}</span>`).join(' ') || '–'}</td>
        <td class="hide-sm num">${cost(g.cost)}</td><td class="num">${g.elapsed ? dur(g.elapsed) : '–'}</td></tr>`
    }).join('')
}

// ---- evidence (UI before/after + videos) ----
function uiCounts(ui) {
  const shots = ui.shots || []
  const moved = shots.filter((s) => ['changed', 'new', 'removed'].includes(s.status))
  return { total: shots.length, changed: moved.length, todo: moved.filter((s) => !s.verdict).length, flagged: shots.filter((s) => s.verdict === 'unexpected' || s.verdict === 'broken').length }
}
function renderEvidence(run) {
  const cards = []
  if (run.ui) {
    const c = uiCounts(run.ui)
    const cls = c.flagged ? 'warn' : c.todo ? 'todo' : run.ui.verdict === 'PASS' ? 'good' : ''
    cards.push(`<button class="ev ${cls}" data-ui="1"><div class="l">UI before / after</div><div class="v">${c.changed} of ${c.total} screens changed</div><div class="h">${[c.flagged && `${c.flagged} flagged`, c.todo && `${c.todo} to review`, run.ui.verdict && `review: ${run.ui.verdict}`].filter(Boolean).join(' · ') || 'side by side, slider and diff'}</div></button>`)
  }
  const v = run.videos || []
  if (v.length) {
    const demos = v.filter((x) => x.kind === 'demo').length
    cards.push(`<button class="ev" data-videos="1"><div class="l">Agent QA videos</div><div class="v">${v.length} recordings</div><div class="h">${demos ? `${demos} demo · ` : ''}${v.length - demos} QA exploration</div></button>`)
  }
  $('evBlock').hidden = !cards.length
  $('evid').innerHTML = cards.join('')
}

// ---- deliverables (run artifacts) ----
async function renderDocs(run) {
  const arts = run.artifacts || []
  $('docsBlock').hidden = !arts.length
  if (!arts.length) return
  if (!docSel || !arts.some((a) => a.path === docSel)) { docSel = (arts.find((a) => /plan|evidence/i.test(a.name)) || arts[0]).path; docText = undefined }
  $('doclist').innerHTML = arts.map((a) => `<button class="docitem ${a.path === docSel ? 'sel' : ''}" data-doc="${esc(a.path)}"><div class="t">${esc(a.name.replace(/\.md\.md$/, '.md'))}</div><div class="p">${esc(a.source || a.path)}</div></button>`).join('')
  let text
  try { text = await fetchText(`data/${docSel}`) } catch (e) { text = `_${e.message}_` }
  if (text !== docText) { docText = text; $('viewer').innerHTML = markdown(text) }
}

// ---- drawer ----
const UI_STATUS = { changed: 'changed', new: 'new page', removed: 'removed', pending: 'no after yet', unchanged: 'unchanged' }
const UI_TONE = { expected: 'good', unexpected: 'warn', broken: 'stop' }
const UI_ORDER = ['changed', 'new', 'removed', 'pending', 'unchanged']
let uiShot = null, uiMode = store.get('uimode', 'side'), uiSplit = 50, uiKey = ''
function uiImg(src, alt, empty) {
  return src ? `<a class="ui-img" href="${esc(src)}" target="_blank" rel="noopener"><img src="${esc(src)}" alt="${esc(alt)}" loading="lazy"></a>` : `<div class="ui-none">${esc(empty)}</div>`
}
function renderUi(run) {
  const ui = run.ui
  $('d-num').textContent = `${run.name} · UI verification`
  $('d-doc').className = 'uiv'
  if (!ui) { $('d-title').textContent = 'No screenshots yet'; $('d-deps').innerHTML = ''; $('d-files').innerHTML = ''; $('d-doc').innerHTML = '<p class="ui-none">No screenshots yet. The before shots are taken after H1, before any code changes.</p>'; uiKey = ''; return }
  const r = ui.run || {}
  const commit = (p) => r[p] ? `<code>${esc(r[p].commit || '?')}</code>${r[p].dirty_files ? ` +${esc(r[p].dirty_files)} uncommitted` : ''}` : 'not taken'
  const shots = ui.shots || []
  if (!uiShot || !shots.some((s) => s.id === uiShot)) uiShot = (shots.find((s) => s.status !== 'unchanged') || shots[0] || {}).id
  const s = shots.find((x) => x.id === uiShot)
  const c = uiCounts(ui)
  $('d-title').textContent = `Before / after · ${c.changed} of ${c.total} changed`
  const vtone = ui.verdict === 'PASS' ? 'good' : ui.verdict ? 'warn' : ''
  $('d-deps').innerHTML = `<div><span class="k">before</span>${commit('before')}<span class="k" style="margin-left:14px">after</span>${commit('after')}</div>`
    + `<div><span class="k">review</span>${ui.verdict ? `<span class="verdict ${vtone}" style="margin:0 6px 0 0;padding:1px 7px">${esc(ui.verdict)}</span>${esc(ui.summary || '')}` : `not reviewed yet${c.todo ? ` · ${c.todo} changed shots wait for the UI review` : ''}`}</div>`
  let nav = ''
  for (const stt of UI_ORDER) {
    const list = shots.filter((x) => x.status === stt)
    if (!list.length) continue
    nav += `<div class="group">${esc(UI_STATUS[stt])} · ${list.length}</div>` + list.map((x) => {
      const tone = UI_TONE[x.verdict] || (stt !== 'unchanged' && stt !== 'pending' ? 'todo' : '')
      return `<button class="file ${x.id === uiShot ? 'on' : ''}" data-shot="${esc(x.id)}" title="${esc(x.id)}"><span class="v ${tone}"></span>${esc(x.page)} <span style="color:var(--faint)">${esc(x.role)} · ${esc(x.viewport)}${x.theme !== 'light' ? ' · ' + esc(x.theme) : ''}</span></button>`
    }).join('')
  }
  let view = ''
  if (s) {
    const redirect = [['before', s.final_path_before], ['after', s.final_path_after]].filter(([, p]) => p && p !== s.page.split('?')[0])
    view += `<div class="ui-meta"><span class="state">${esc(UI_STATUS[s.status] || s.status)}</span><b>${esc(s.page)}</b><span>${esc(s.role)}</span><span>${esc(s.viewport)}</span><span>${esc(s.theme)}</span>
      ${s.changed_pct != null ? `<span>${esc(s.changed_pct)}% of pixels (${esc(s.changed_pixels)})</span>` : ''}${s.size_changed ? '<span>page size changed</span>' : ''}</div>`
    if (redirect.length) view += `<p class="ui-flag">⚠ Redirected: ${redirect.map(([p, to]) => `${p} → <code>${esc(to)}</code>`).join(', ')}</p>`
    if (s.verdict || s.note) view += `<p class="ui-note">${s.verdict ? `<span class="verdict ${UI_TONE[s.verdict] || ''}">${esc(s.verdict)}</span>` : ''}${esc(s.note || '')}</p>`
    const mode = uiMode === 'diff' && !s.diff ? 'side' : uiMode === 'slider' && !(s.before && s.after) ? 'side' : uiMode
    view += `<div class="seg" role="tablist"><button data-uimode="side" class="${mode === 'side' ? 'on' : ''}">Side by side</button><button data-uimode="slider" class="${mode === 'slider' ? 'on' : ''}" ${s.before && s.after ? '' : 'disabled'}>Slider</button><button data-uimode="diff" class="${mode === 'diff' ? 'on' : ''}" ${s.diff ? '' : 'disabled'}>Diff</button></div>`
    if (mode === 'slider') {
      view += `<div class="ui-cap"><span>◀ before</span><span>after ▶</span></div><div class="ui-slide" style="--split:@@SPLIT@@%"><img src="${esc(s.after)}" alt="after"><img class="b" src="${esc(s.before)}" alt="before"><span class="ui-split"></span><input type="range" min="0" max="100" value="@@SPLIT@@" aria-label="Before / after split"></div>`
    } else if (mode === 'diff') {
      view += `<div class="ui-cap"><span>red = pixels that changed</span></div>${uiImg(s.diff, 'diff', '')}`
    } else {
      view += `<div class="ui-pair"><figure><figcaption>Before · ${r.before ? esc(r.before.commit) : ''}</figcaption>${uiImg(s.before, 'before', 'No before: this page is new in this run.')}</figure>
        <figure><figcaption>After · ${r.after ? esc(r.after.commit) : ''}${s.marked && s.status === 'changed' ? ' · changed areas boxed' : ''}</figcaption>${uiImg(s.marked && s.status === 'changed' ? s.marked : s.after, 'after', s.status === 'removed' ? 'Removed: not captured after.' : 'Not captured yet.')}</figure></div>`
    }
  }
  const key = nav + '\u0000' + view + $('d-deps').innerHTML
  if (key === uiKey) return
  uiKey = key
  $('d-files').innerHTML = nav
  $('d-doc').innerHTML = view.replaceAll('@@SPLIT@@', String(uiSplit))
}
const VID_KIND = { demo: 'Demo (happy path)', qa: 'QA exploration', other: 'Other' }
let vidOpen = null, vidKey = ''
function renderVideos(run) {
  const v = run.videos || []
  $('d-num').textContent = `${run.name} · videos`
  $('d-doc').className = 'uiv'
  $('d-title').textContent = v.length ? `Agent QA recordings · ${v.length}` : 'No videos yet'
  $('d-deps').innerHTML = '<div><span class="k">source</span>agent-browser record · .agent/video/</div>'
  if (!vidOpen || !v.some((x) => x.name === vidOpen)) vidOpen = (v.find((x) => x.kind === 'demo') || v[0] || {}).name
  let nav = ''
  for (const k of ['demo', 'qa', 'other']) {
    const list = v.filter((x) => x.kind === k)
    if (!list.length) continue
    nav += `<div class="group">${esc(VID_KIND[k])}</div>` + list.map((x) => `<button class="file ${x.name === vidOpen ? 'on' : ''}" data-video="${esc(x.name)}"><span class="v good"></span>${esc(x.role)} <span style="color:var(--faint)">${((x.bytes || 0) / 1048576).toFixed(1)} MB</span></button>`).join('')
  }
  const x = v.find((y) => y.name === vidOpen)
  const view = x ? `<div class="ui-meta"><b>${esc(x.role)}</b><span>${esc(VID_KIND[x.kind] || x.kind)}</span><span>${esc(x.name)}</span></div>
    ${x.src ? `<video class="vid-player" controls preload="metadata" src="${esc(x.src)}"></video>` : `<p class="ui-none">${esc(x.note || 'Video not available here.')}</p>`}
    ${x.sheet ? `<div class="vid-sheet"><div class="ui-cap"><span>contact sheet: the distinct moments in this take</span></div>${uiImg(x.sheet, 'contact sheet', '')}</div>` : ''}` : '<p class="ui-none">QA agents record here when video is on for the run.</p>'
  const key = nav + '\u0000' + view
  if (key === vidKey) return
  vidKey = key
  $('d-files').innerHTML = nav
  $('d-doc').innerHTML = view
}
function groupFiles(run, g) {
  const out = []
  for (const a of g.agents) for (const f of ['result', 'activity', 'prompt'])
    out.push({ group: `${a.step || a.label} · ${cap(a.model)} · ${STATUS_WORD[a.status] || a.status}`, name: f, path: `data/${run.id}/agents/${a.id}/${f}.md`, status: a.status })
  return out
}
async function refreshDrawer() {
  const run = currentRun()
  if (!run || !open) return
  if (open.kind === 'ui') return renderUi(run)
  if (open.kind === 'video') return renderVideos(run)
  $('d-doc').className = 'md'
  const g = run.groups.find((x) => x.id === open.id)
  if (!g) return
  $('d-num').innerHTML = `<span>${esc(g.phase)}${g.num ? ' · ' + esc(g.num) : ''}</span><span>${g.cost ? money(g.cost) : ''}</span><span>${g.elapsed ? dur(g.elapsed) : ''}</span>${pill(g)}`
  $('d-title').textContent = g.title
  const up = model.up(g.id), down = model.down(g.id)
  $('d-deps').innerHTML = (up.length ? `<div><span class="k">after</span>${depChips(up)}</div>` : '') + (down.length ? `<div><span class="k">unblocks</span>${depChips(down)}</div>` : '')
  const files = groupFiles(run, g)
  if (!files.length) { $('d-files').innerHTML = ''; $('d-doc').innerHTML = '<p class="muted">No agent files for this step.</p>'; return }
  if (!openFile || !files.some((f) => f.path === openFile)) {
    const lastRunning = files.at(-1)?.status === 'RUN'
    openFile = (files.filter((f) => f.name === (lastRunning ? 'activity' : 'result')).at(-1) || files[0]).path
  }
  let grp = null
  $('d-files').innerHTML = files.map((f) => {
    const head = f.group !== grp ? `<div class="group">${esc(f.group)}</div>` : ''
    grp = f.group
    const tone = f.status === 'FAIL' ? 'stop' : f.status === 'CHANGES' ? 'warn' : ['PASS', 'DONE'].includes(f.status) ? 'good' : ''
    return `${head}<button class="file ${f.path === openFile ? 'on' : ''}" data-file="${esc(f.path)}"><span class="v ${f.name === 'result' ? tone : ''}"></span>${esc(cap(f.name))}</button>`
  }).join('')
  let text
  try { text = await fetchText(openFile) } catch (e) { text = `_${e.message}_` }
  if (text !== openText) { openText = text; $('d-doc').innerHTML = markdown(text) }
}
async function openDrawer(o) {
  open = o; uiKey = ''; vidKey = ''; openFile = null; openText = undefined
  document.body.classList.toggle('ui-open', o.kind === 'ui' || o.kind === 'video')
  document.body.classList.add('open')
  $('d-doc').parentElement.scrollTop = 0
  await refreshDrawer()
}
function closeDrawer() { open = null; document.body.classList.remove('open', 'ui-open') }

// ---- poll ----
async function poll() {
  const status = $('status')
  try {
    state = JSON.parse(await fetchText('data/state.json'))
    if (state.error) throw new Error(state.error)
    render()
    if (open) await refreshDrawer()
    status.className = SNAP ? 'live snap' : 'live'
    status.innerHTML = SNAP ? `<span class="dot"></span>Snapshot · ${esc(new Date((SNAP.generated || 0) * 1000).toLocaleString())}` : `<span class="dot"></span>Live · ${new Date().toLocaleTimeString()}`
  } catch (err) {
    status.className = 'live error'
    status.innerHTML = `<span class="dot"></span>${esc(err.message)}`
  }
}

// ---- events ----
$('run-btn').addEventListener('click', (e) => { e.stopPropagation(); $('run-pop').hidden ? openPop() : closePop() })
$('run-q').addEventListener('input', () => { popIndex = 0; renderRunPicker() })
$('run-q').addEventListener('keydown', (e) => {
  const rows = [...$('run-list').querySelectorAll('.run-row')]
  if (e.key === 'ArrowDown') { e.preventDefault(); popIndex = Math.min(rows.length - 1, popIndex + 1); markKb() }
  else if (e.key === 'ArrowUp') { e.preventDefault(); popIndex = Math.max(0, popIndex - 1); markKb() }
  else if (e.key === 'Enter') { const r = rows[Math.max(0, popIndex)]; if (r) selectRun(r.dataset.run) }
  else if (e.key === 'Escape') { e.stopPropagation(); closePop(); $('run-btn').focus() }
})
document.addEventListener('input', (e) => {
  if (e.target.matches('.ui-slide input')) { uiSplit = +e.target.value; e.target.parentElement.style.setProperty('--split', uiSplit + '%') }
})
document.addEventListener('click', (e) => {
  if (e.target.closest('a')) return
  if (!e.target.closest('#run-pop') && !$('run-pop').hidden) closePop()
  const t = (sel) => e.target.closest(sel)
  let el
  if ((el = t('[data-run]'))) return selectRun(el.dataset.run)
  if ((el = t('[data-filter]'))) { prefs.filter = el.dataset.filter; return render() }
  if ((el = t('[data-role]'))) { prefs.role = el.dataset.role; return render() }
  if ((el = t('[data-phase]'))) { prefs.phase = prefs.phase === el.dataset.phase ? '' : el.dataset.phase; return render() }
  if ((el = t('[data-doc]'))) { docSel = el.dataset.doc; docText = undefined; return renderDocs(currentRun()) }
  if (t('[data-ui]')) return openDrawer({ kind: 'ui' })
  if (t('[data-videos]')) return openDrawer({ kind: 'video' })
  if ((el = t('[data-video]'))) { vidOpen = el.dataset.video; vidKey = ''; return refreshDrawer() }
  if ((el = t('[data-shot]'))) { uiShot = el.dataset.shot; uiKey = ''; $('d-doc').parentElement.scrollTop = 0; return refreshDrawer() }
  if ((el = t('[data-uimode]'))) { if (!el.disabled) { uiMode = el.dataset.uimode; store.set('uimode', uiMode); uiKey = ''; refreshDrawer() } return }
  if ((el = t('[data-file]'))) { openFile = el.dataset.file; openText = undefined; $('d-doc').parentElement.scrollTop = 0; return refreshDrawer() }
  if ((el = t('[data-group]'))) return openDrawer({ kind: 'group', id: el.dataset.group })
  if (t('[data-close]')) closeDrawer()
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (!$('run-pop').hidden) return closePop(); return closeDrawer() }
  const row = e.target.closest?.('[data-group]')
  if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); return openDrawer({ kind: 'group', id: row.dataset.group }) }
  if (e.target.closest?.('input, textarea, select') || e.metaKey || e.ctrlKey || e.altKey || document.body.classList.contains('open')) return
  if (e.key.toLowerCase() === 'r') { e.preventDefault(); openPop() }
})

// ---- markdown (no external library: works offline and in snapshots) ----
function tone(first) {
  if (/^(VERDICT:\s*PASS|GATE:\s*PASS|APPROVE|STATUS:\s*READY|DECISION:\s*ACCEPT)$/.test(first)) return 'good'
  if (/^(VERDICT:\s*CHANGES|DECISION:\s*NEEDS-INFO)$/.test(first)) return 'warn'
  if (/^(ESCALATE|STATUS:\s*BLOCKED|GATE:\s*FAIL|DECISION:\s*REJECT)$/.test(first)) return 'stop'
  return null
}
function inline(s) {
  const codes = []
  s = esc(s).replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`)
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|\.{0,2}\/|#)[^)\s]*)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`)
}
function markdown(src) {
  const lines = String(src).replace(/\r/g, '').split('\n')
  let i = 0, html = ''
  const first = (lines[0] || '').trim()
  const t = tone(first)
  if (t) {
    html += `<div class="verdict ${t}">${esc(first)}</div>`
    i = 1
    const extra = []
    while (i < lines.length && /^[A-Z-]+:\s/.test(lines[i])) extra.push(lines[i++])
    if (extra.length) html += `<div class="head">${esc(extra.join('\n'))}</div>`
  }
  const isList = (l) => /^\s*([-*+]|\d+\.)\s+/.test(l)
  const isBlockStart = (l) => /^(#{1,6}\s|```|\s*>|\|)/.test(l) || isList(l)
  while (i < lines.length) {
    const line = lines[i]
    if (!line.trim()) { i++; continue }
    if (line.startsWith('```')) { const body = []; i++; while (i < lines.length && !lines[i].startsWith('```')) body.push(lines[i++]); i++; html += `<pre><code>${esc(body.join('\n'))}</code></pre>`; continue }
    const h = line.match(/^(#{1,6})\s+(.*)$/)
    if (h) { const n = Math.min(h[1].length, 4); html += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue }
    if (/^\s*>/.test(line)) { const body = []; while (i < lines.length && /^\s*>/.test(lines[i])) body.push(lines[i++].replace(/^\s*>\s?/, '')); html += `<blockquote>${markdown(body.join('\n'))}</blockquote>`; continue }
    if (line.startsWith('|')) {
      const rows = []
      while (i < lines.length && lines[i].startsWith('|')) rows.push(lines[i++])
      const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()))
      const body = rows.filter((r) => !/^\|[\s:|-]+\|$/.test(r))
      html += '<table>' + body.map((r, n) => `<tr>${cells(r).map((c) => n ? `<td>${c}</td>` : `<th>${c}</th>`).join('')}</tr>`).join('') + '</table>'
      continue
    }
    if (isList(line)) {
      const ordered = /^\s*\d+\./.test(line), items = []
      while (i < lines.length && (isList(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const l = lines[i++]
        if (isList(l)) items.push({ indent: l.match(/^\s*/)[0].length, text: l.replace(/^\s*([-*+]|\d+\.)\s+/, '') })
        else items[items.length - 1].text += ' ' + l.trim()
      }
      const lis = items.map(({ indent, text }) => {
        const task = text.match(/^\[([ xX])\]\s+(.*)$/)
        const style = indent ? ` style="margin-left:${indent * 0.6}em"` : ''
        return task ? `<li class="task ${task[1] === ' ' ? '' : 'done'}"${style}>${inline(task[2])}</li>` : `<li${style}>${inline(text)}</li>`
      }).join('')
      html += ordered ? `<ol>${lis}</ol>` : `<ul>${lis}</ul>`
      continue
    }
    const para = []
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) para.push(lines[i++])
    html += `<p>${inline(para.join(' '))}</p>`
  }
  return html
}

poll()
if (!SNAP) setInterval(poll, POLL_MS)
