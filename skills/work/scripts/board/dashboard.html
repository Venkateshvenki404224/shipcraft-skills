<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workflow Board</title>
<style>
  :root {
    --bg: #14151b;
    --panel: #1a1c24;
    --card: #20222c;
    --card-hover: #252835;
    --line: #2b2e3b;
    --text: #e4e5ea;
    --muted: #868ba0;
    --faint: #5b6075;
    --active: #8be9fd;
    --pass: #50fa7b;
    --changes: #ffb86c;
    --human: #ff79c6;
    --merged: #bd93f9;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  /* ---- Header ---- */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    flex-wrap: wrap; padding: 22px 32px 6px;
  }
  .title { display: flex; align-items: center; gap: 12px; min-width: 0; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  header .right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; position: relative; }
  .status { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .status .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--pass); margin-right: 6px; vertical-align: 1px;
  }
  .status.error { color: var(--human); }
  .status.error .dot { background: var(--human); }
  .banner {
    margin: 12px 32px 0; padding: 10px 14px; border: 1px solid var(--human);
    border-radius: 8px; color: var(--human); font-family: var(--mono); font-size: 12px;
  }
  .state { padding: 2px 9px; border-radius: 999px; font-weight: 600; font-family: var(--mono); font-size: 11.5px; white-space: nowrap; }
  .state.running, .state.between { color: var(--active); background: color-mix(in srgb, var(--active) 14%, transparent); }
  .state.finished, .state.completed { color: var(--pass); background: color-mix(in srgb, var(--pass) 14%, transparent); }
  .state.waiting { color: var(--human); background: color-mix(in srgb, var(--human) 16%, transparent); }
  .state.idle, .state.stalled, .state.error { color: var(--changes); background: color-mix(in srgb, var(--changes) 16%, transparent); }

  /* ---- Run picker ---- */
  .run-btn {
    display: flex; align-items: center; gap: 8px; max-width: 360px; cursor: pointer;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
    font-family: var(--mono); font-size: 12px;
  }
  .run-btn:hover { border-color: var(--faint); }
  .run-btn .rn { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .run-btn .kbd, .kbd { font-size: 10px; color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .sdot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--faint); }
  .sdot.running, .sdot.between { background: var(--active); animation: pulse 1.6s ease-in-out infinite; }
  .sdot.finished, .sdot.completed { background: var(--pass); }
  .sdot.waiting { background: var(--human); animation: pulse 1.6s ease-in-out infinite; }
  .sdot.idle, .sdot.stalled, .sdot.error { background: var(--changes); }
  .pop {
    position: absolute; top: calc(100% + 8px); right: 0; z-index: 20; width: min(440px, calc(100vw - 32px));
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 24px 48px -16px rgba(0, 0, 0, .7); overflow: hidden;
  }
  .pop input {
    width: 100%; background: var(--bg); border: 0; border-bottom: 1px solid var(--line); color: var(--text);
    padding: 11px 14px; font: 13px var(--mono); outline: none;
  }
  .pop-list { max-height: min(520px, 70vh); overflow-y: auto; padding: 6px; }
  .pop-sec { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); padding: 8px 8px 4px; }
  .run-row {
    display: grid; grid-template-columns: 10px 1fr auto; gap: 4px 10px; align-items: center; width: 100%;
    text-align: left; background: none; border: 0; border-radius: 8px; padding: 8px 10px; cursor: pointer;
  }
  .run-row:hover, .run-row.kb { background: var(--card); }
  .run-row.on { background: var(--card-hover); box-shadow: inset 2px 0 0 var(--active); }
  .run-row .nm { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .run-row .ago { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; }
  .run-row .sub { grid-column: 2 / 4; display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .run-row .sub .bar { flex: 1; min-width: 60px; }
  .pop-empty { padding: 14px; color: var(--faint); font-size: 12px; }

  /* ---- Progress / toolbar ---- */
  .overview { padding: 10px 32px 0; display: grid; gap: 12px; }
  .bar { display: flex; height: 6px; border-radius: 999px; overflow: hidden; background: var(--line); }
  .bar > i { display: block; height: 100%; }
  .bar .done { background: var(--pass); }
  .bar .issue { background: var(--changes); }
  .bar .running { background: repeating-linear-gradient(-45deg, var(--active) 0 6px, color-mix(in srgb, var(--active) 55%, transparent) 6px 12px); background-size: 17px 17px; animation: stripes 1s linear infinite; }
  .bar .wait { background: var(--human); }
  .bar .queued { background: color-mix(in srgb, var(--faint) 60%, transparent); }
  .bar .skipped { background: transparent; }
  .overview .bar { height: 8px; }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; font-family: var(--mono); font-size: 12px; color: var(--muted); align-items: center; }
  .stats b { color: var(--text); font-weight: 600; }
  .stats .pct { color: var(--pass); }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button {
    background: none; border: 0; padding: 5px 12px; cursor: pointer; font-size: 12px; color: var(--muted);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { background: var(--card-hover); color: var(--text); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .fchip {
    display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; color: var(--muted);
    background: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px;
  }
  .fchip:hover { border-color: var(--faint); color: var(--text); }
  .fchip.on { color: var(--text); border-color: var(--text); background: var(--card); }
  .fchip .n { font-family: var(--mono); font-size: 11px; }
  .fchip .sw { width: 8px; height: 8px; border-radius: 50%; }
  .sw.running { background: var(--active); } .sw.done { background: var(--pass); } .sw.issue { background: var(--changes); }
  .sw.wait { background: var(--human); } .sw.queued { background: var(--faint); } .sw.skipped { background: none; border: 1px dashed var(--faint); }
  .toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); cursor: pointer; user-select: none; }
  .toggle input { accent-color: var(--pass); margin: 0; }

  /* Now running strip */
  .now {
    display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; padding: 10px 12px;
    border: 1px solid color-mix(in srgb, var(--active) 35%, var(--line)); border-radius: 10px;
    background: color-mix(in srgb, var(--active) 5%, var(--panel));
  }
  .now.quiet { border-color: var(--line); background: var(--panel); }
  .now.done-run { border-color: color-mix(in srgb, var(--pass) 40%, var(--line)); background: color-mix(in srgb, var(--pass) 5%, var(--panel)); }
  .now.your-turn { border-color: var(--human); background: color-mix(in srgb, var(--human) 6%, var(--panel)); }
  .now .lbl {
    font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--active); font-weight: 600;
    display: flex; align-items: center; gap: 6px; padding-right: 6px;
  }
  .now.quiet .lbl { color: var(--muted); } .now.done-run .lbl { color: var(--pass); } .now.your-turn .lbl { color: var(--human); }
  .now-item {
    display: grid; grid-template-columns: auto 1fr auto; gap: 0 8px; align-items: center; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer;
    min-width: 0; max-width: 420px; flex: 1 1 260px;
  }
  .now-item:hover { background: var(--card-hover); }
  .now-item .t { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now-item .num { font-family: var(--mono); font-size: 11px; color: var(--active); }
  .now-item .el { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .now-item .ln { grid-column: 1 / 4; font-family: var(--mono); font-size: 10.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .now .msg { font-size: 12.5px; color: var(--muted); align-self: center; }
  .arts { display: flex; gap: 8px; flex-wrap: wrap; }
  .art {
    font-family: var(--mono); font-size: 12px; color: var(--active); background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; cursor: pointer;
  }
  .art:hover { background: var(--card-hover); }

  /* ---- Board ---- */
  .board {
    display: grid; grid-template-columns: repeat(var(--cols, 6), minmax(220px, 1fr)); gap: 12px;
    padding: 18px 32px 40px; align-items: start; overflow-x: auto;
  }
  .col { min-width: 0; }
  .col-head {
    display: flex; align-items: center; gap: 8px; padding: 0 2px 8px;
    border-bottom: 2px solid var(--line); margin-bottom: 12px; position: relative;
  }
  .col-head h2 { margin: 0; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .col-head .who { font-size: 11px; color: var(--faint); font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .col-head .count { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
  .col.all-done .col-head { border-bottom-color: color-mix(in srgb, var(--pass) 55%, transparent); }
  .col.all-done h2 { color: var(--pass); }
  .col.live .col-head { border-bottom-color: var(--active); }
  .col.live h2 { color: var(--active); }
  .col.pending h2 { color: var(--muted); }
  .empty { color: var(--faint); font-size: 12px; padding: 4px 2px; }

  .card {
    position: relative; display: block; width: 100%; text-align: left; cursor: pointer; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 11px 12px 10px; margin-bottom: 10px;
    transition: background .15s, border-color .15s, transform .15s, opacity .15s;
  }
  .card:hover { background: var(--card-hover); transform: translateY(-1px); }
  .card:focus-visible { outline: 2px solid var(--active); outline-offset: 2px; }
  .card.running {
    border-color: var(--active);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--active) 35%, transparent), 0 10px 28px -14px var(--active);
    background: color-mix(in srgb, var(--active) 6%, var(--card));
  }
  .card.done { border-color: color-mix(in srgb, var(--pass) 30%, var(--line)); background: color-mix(in srgb, var(--pass) 4%, var(--card)); }
  .card.done::before, .card.running::before, .card.issue::before, .card.wait::before {
    content: ""; position: absolute; left: -1px; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0;
  }
  .card.done::before { background: var(--pass); }
  .card.running::before { background: var(--active); }
  .card.issue::before { background: var(--changes); }
  .card.wait::before { background: var(--human); }
  .card.wait {
    border-color: var(--human);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--human) 40%, transparent), 0 8px 24px -12px color-mix(in srgb, var(--human) 60%, transparent);
  }
  .card.issue { border-color: color-mix(in srgb, var(--changes) 55%, var(--line)); }
  .card.fail { border-color: var(--human); }
  .card.queued { opacity: .55; border-style: dashed; background: transparent; }
  .card.skipped { opacity: .45; border-style: dashed; background: transparent; }
  .card.skipped .feature { text-decoration: line-through; text-decoration-color: var(--faint); }
  .card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .num { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .card-top .num { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge {
    margin-left: auto; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap;
    font-size: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    padding: 1px 7px; border-radius: 999px;
  }
  .badge.running { color: var(--bg); background: var(--active); }
  .badge.done { color: var(--pass); background: color-mix(in srgb, var(--pass) 14%, transparent); }
  .badge.issue { color: var(--changes); background: color-mix(in srgb, var(--changes) 16%, transparent); }
  .badge.fail { color: var(--human); background: color-mix(in srgb, var(--human) 16%, transparent); }
  .badge.wait { color: var(--bg); background: var(--human); }
  .badge.queued, .badge.skipped { color: var(--faint); border: 1px dashed var(--faint); }
  .badge .pulse { background: var(--bg); width: 6px; height: 6px; }
  .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--active); animation: pulse 1.6s ease-in-out infinite; flex: none; }
  .feature { font-size: 13px; line-height: 1.4; margin: 0 0 6px; }
  .meta { display: flex; gap: 10px; margin-top: 8px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); flex-wrap: wrap; }
  .last {
    font-family: var(--mono); font-size: 10.5px; color: var(--faint); line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    overflow-wrap: anywhere; margin: 2px 0 4px;
  }
  .card.running .last { color: color-mix(in srgb, var(--active) 70%, var(--muted)); }
  .deps { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; margin-top: 6px; font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
  .dep { padding: 0 5px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted); }
  .dep.done { color: var(--pass); border-color: color-mix(in srgb, var(--pass) 35%, transparent); }
  .dep.running { color: var(--active); border-color: var(--active); }
  .dep.issue { color: var(--changes); border-color: color-mix(in srgb, var(--changes) 45%, transparent); }
  .dep.wait { color: var(--human); border-color: var(--human); }
  button.dep { cursor: pointer; background: none; font: inherit; font-family: var(--mono); font-size: 11px; padding: 1px 6px; }
  button.dep:hover { background: var(--card); }

  /* compact completed card */
  .card.mini { display: flex; align-items: center; gap: 8px; padding: 5px 10px; margin-bottom: 6px; border-radius: 8px; }
  .card.mini::before { top: 5px; bottom: 5px; }
  .card.mini .tick { color: var(--pass); font-size: 12px; flex: none; }
  .card.mini .num { font-size: 11px; flex: none; color: color-mix(in srgb, var(--pass) 70%, var(--muted)); }
  .card.mini .t { font-size: 12px; color: var(--muted); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .card.mini .el { font-family: var(--mono); font-size: 10.5px; color: var(--faint); flex: none; }
  .card.mini:hover .t { color: var(--text); }

  .steps { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .chip {
    flex: 0 0 auto; text-align: center; font-family: var(--mono); font-size: 10px;
    padding: 2px 7px; border-radius: 4px; border: 1px dashed var(--faint); color: var(--faint);
  }
  .chip.wait { animation: breathe 1.6s ease-in-out infinite; }
  .chip.PASS, .chip.DONE { border: 1px solid transparent; color: var(--pass); background: color-mix(in srgb, var(--pass) 12%, transparent); }
  .chip.CHANGES { border: 1px solid transparent; color: var(--changes); background: color-mix(in srgb, var(--changes) 16%, transparent); }
  .chip.FAIL { border: 1px solid transparent; color: var(--human); background: color-mix(in srgb, var(--human) 16%, transparent); }
  .chip.RUN { color: var(--active); border: 1px solid var(--active); }
  .chip.WAIT { color: var(--human); border: 1px solid var(--human); }
  .chip.STOPPED, .chip.TODO { border: 1px dashed var(--faint); color: var(--faint); }
  .chip.bad { border: 1px solid var(--human); color: var(--human); }

  /* ---- Graph ---- */
  .graph-wrap { position: relative; margin: 18px 32px 32px; border: 1px solid var(--line); border-radius: 12px; background:
    radial-gradient(circle, color-mix(in srgb, var(--faint) 35%, transparent) 1px, transparent 1.2px) 0 0 / 22px 22px, var(--panel);
    height: max(420px, calc(100vh - 300px)); overflow: hidden; touch-action: none; cursor: grab; }
  .graph-wrap.dragging { cursor: grabbing; }
  .stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .stage svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
  .edge { fill: none; stroke: var(--line); stroke-width: 1.6; transition: opacity .15s, stroke .15s; }
  .edge.done { stroke: color-mix(in srgb, var(--pass) 45%, var(--line)); }
  .edge.ready { stroke: color-mix(in srgb, var(--pass) 75%, transparent); stroke-width: 2; }
  .edge.flow { stroke: var(--active); stroke-width: 2.2; stroke-dasharray: 6 6; animation: flow .8s linear infinite; }
  .edge.blocked { stroke: var(--line); stroke-dasharray: 3 5; }
  .ah { fill: var(--line); } .ah.done { fill: color-mix(in srgb, var(--pass) 45%, var(--line)); } .ah.ready { fill: var(--pass); } .ah.flow { fill: var(--active); }
  .phase-lbl {
    position: absolute; font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--faint);
    white-space: nowrap; font-weight: 600; pointer-events: none;
  }
  .phase-lbl.done { color: color-mix(in srgb, var(--pass) 70%, var(--faint)); } .phase-lbl.live { color: var(--active); }
  .node {
    position: absolute; width: 214px; height: 64px; padding: 8px 10px 7px 13px; cursor: pointer; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    display: grid; grid-template-rows: auto 1fr; gap: 2px; transition: opacity .15s, box-shadow .15s, border-color .15s;
  }
  .node::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--faint); }
  .node .nh { display: flex; gap: 6px; align-items: center; font-family: var(--mono); font-size: 10.5px; color: var(--muted); min-width: 0; }
  .node .nh .num { font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .nh .st { margin-left: auto; white-space: nowrap; font-weight: 600; }
  .node .nt { font-size: 12px; line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .node.done { background: color-mix(in srgb, var(--pass) 7%, var(--card)); border-color: color-mix(in srgb, var(--pass) 35%, var(--line)); }
  .node.done::before { background: var(--pass); } .node.done .st { color: var(--pass); }
  .node.running { border-color: var(--active); background: color-mix(in srgb, var(--active) 9%, var(--card)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--active) 18%, transparent), 0 0 24px -4px color-mix(in srgb, var(--active) 55%, transparent); }
  .node.running::before { background: var(--active); } .node.running .st { color: var(--active); }
  .node.issue { border-color: color-mix(in srgb, var(--changes) 55%, var(--line)); } .node.issue::before { background: var(--changes); } .node.issue .st { color: var(--changes); }
  .node.fail .st { color: var(--human); } .node.fail::before { background: var(--human); }
  .node.wait { border-color: var(--human); box-shadow: 0 0 0 3px color-mix(in srgb, var(--human) 18%, transparent); } .node.wait::before { background: var(--human); } .node.wait .st { color: var(--human); }
  .node.queued, .node.skipped { border-style: dashed; background: color-mix(in srgb, var(--card) 50%, transparent); }
  .node.queued .nt, .node.skipped .nt { color: var(--muted); }
  .node.skipped .nt { text-decoration: line-through; text-decoration-color: var(--faint); }
  .node:hover { border-color: var(--text); }
  .gate {
    position: absolute; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel);
    display: grid; place-items: center; font-size: 11px; color: var(--faint); pointer-events: auto; transition: opacity .15s;
  }
  .gate.done { border-color: var(--pass); color: var(--pass); }
  .gate.live { border-color: var(--active); color: var(--active); }
  .graph-wrap.hl .node, .graph-wrap.hl .gate { opacity: .22; }
  .graph-wrap.hl .edge { opacity: .12; }
  .graph-wrap.hl .on-path { opacity: 1; }
  .graph-wrap.hl .node.focus { box-shadow: 0 0 0 2px var(--text); }
  .graph-wrap.dim-filter .node.nomatch { opacity: .25; }
  .gctl { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; z-index: 2; }
  .gctl button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); cursor: pointer; color: var(--muted); }
  .gctl button:hover { color: var(--text); border-color: var(--faint); }
  .gctl button.wide { width: auto; padding: 0 10px; font-size: 12px; }
  .legend {
    position: absolute; left: 12px; bottom: 10px; z-index: 2; display: flex; gap: 12px; flex-wrap: wrap;
    font-size: 11px; color: var(--muted); background: color-mix(in srgb, var(--panel) 85%, transparent); padding: 5px 10px; border-radius: 8px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .legend .ln { width: 18px; height: 0; border-top: 2px solid var(--line); }
  .legend .ln.ready { border-color: var(--pass); } .legend .ln.flow { border-top: 2px dashed var(--active); }
  .graph-hint { position: absolute; right: 12px; bottom: 10px; font-size: 11px; color: var(--faint); z-index: 2; }

  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  @keyframes stripes { to { background-position: 17px 0; } }
  @keyframes flow { to { stroke-dashoffset: -12; } }
  @media (prefers-reduced-motion: reduce) { .pulse, .chip.wait, .sdot, .bar .running, .edge.flow { animation: none !important; } }

  /* ---- Drawer ---- */
  .scrim {
    position: fixed; inset: 0; background: rgba(5, 6, 10, .55); z-index: 30;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(920px, 100vw); z-index: 31;
    background: var(--panel); border-left: 1px solid var(--line);
    display: grid; grid-template-rows: auto 1fr; transform: translateX(100%);
    transition: transform .25s ease;
  }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .drawer { transform: none; }
  .d-head { padding: 20px 24px 14px; border-bottom: 1px solid var(--line); position: relative; }
  .d-head .num { font-size: 12px; }
  .d-head h3 { margin: 4px 40px 6px 0; font-size: 16px; font-weight: 600; line-height: 1.35; }
  .d-deps { display: grid; gap: 4px; font-size: 11.5px; color: var(--faint); }
  .d-deps > div { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .d-deps .k { width: 64px; font-family: var(--mono); }
  .close {
    position: absolute; top: 16px; right: 16px; width: 32px; height: 32px;
    border-radius: 8px; border: 1px solid var(--line); background: none; cursor: pointer;
    color: var(--muted); font-size: 18px; line-height: 1;
  }
  .close:hover { color: var(--text); border-color: var(--muted); }
  .d-body { display: grid; grid-template-columns: 200px 1fr; min-height: 0; }
  .files { border-right: 1px solid var(--line); padding: 14px 10px; overflow-y: auto; }
  .files .group { color: var(--faint); margin: 12px 8px 4px; font-family: var(--mono); font-size: 11px; }
  .files .group:first-child { margin-top: 0; }
  .file {
    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;
    background: none; border: 0; border-radius: 6px; padding: 5px 8px; cursor: pointer;
    font-family: var(--mono); font-size: 12px; color: var(--muted);
  }
  .file:hover { background: var(--card); color: var(--text); }
  .file.on { background: var(--card-hover); color: var(--text); }
  .file .rn { display: none; }
  .file .v { width: 6px; height: 6px; border-radius: 50%; background: var(--faint); flex: none; }
  .v.good { background: var(--pass); } .v.warn { background: var(--changes); } .v.stop { background: var(--human); }
  .doc { overflow-y: auto; padding: 22px 28px 60px; min-width: 0; }

  /* Rendered markdown */
  .md { max-width: 680px; line-height: 1.65; }
  .md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 1.6em 0 .5em; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 15px; } .md h3 { font-size: 14px; color: var(--muted); }
  .md > :first-child { margin-top: 0; }
  .md p, .md ul, .md ol, .md blockquote, .md pre, .md table { margin: 0 0 .9em; }
  .md ul, .md ol { padding-left: 1.3em; }
  .md li { margin: .2em 0; }
  .md li.task { list-style: none; margin-left: -1.3em; }
  .md li.task::before { content: "☐"; margin-right: .5em; color: var(--faint); }
  .md li.task.done::before { content: "☑"; color: var(--pass); }
  .md code { font-family: var(--mono); font-size: 12px; background: var(--card); padding: 1px 5px; border-radius: 4px; }
  .md pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; }
  .md pre code { background: none; padding: 0; }
  .md blockquote { border-left: 2px solid var(--line); padding-left: 12px; color: var(--muted); }
  .md a { color: var(--active); }
  .md table { border-collapse: collapse; font-size: 13px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--line); padding: 5px 9px; text-align: left; }
  .verdict { display: inline-block; font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 6px; margin-bottom: 14px; }
  .verdict + * { margin-top: .4em; }
  .md .head { font-family: var(--mono); font-size: 12px; color: var(--muted); margin: -6px 0 14px; white-space: pre-line; }
  .verdict.good { color: var(--pass); background: color-mix(in srgb, var(--pass) 14%, transparent); }
  .verdict.warn { color: var(--changes); background: color-mix(in srgb, var(--changes) 16%, transparent); }
  .verdict.stop { color: var(--human); background: color-mix(in srgb, var(--human) 16%, transparent); }

  /* ---- UI before / after ---- */
  .art.ui-art { color: var(--merged); }
  .art.ui-art.todo { color: var(--human); border-color: color-mix(in srgb, var(--human) 45%, var(--line)); }
  .art.ui-art.warn { color: var(--changes); border-color: color-mix(in srgb, var(--changes) 45%, var(--line)); }
  .art.ui-art.good { color: var(--pass); }
  .ui-open .drawer { width: min(1480px, 100vw); }
  .uiv { min-width: 0; }
  .ui-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-family: var(--mono); font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .ui-meta b { color: var(--text); font-weight: 600; }
  .ui-flag { font-size: 12.5px; color: var(--changes); margin: 0 0 10px; }
  .ui-note { font-size: 13px; color: var(--text); margin: 0 0 12px; }
  .ui-note .verdict { margin: 0 8px 0 0; padding: 2px 8px; font-size: 11.5px; }
  .seg.ui-modes { margin: 2px 0 14px; display: inline-flex; }
  .seg.ui-modes button[disabled] { opacity: .4; cursor: default; }
  .ui-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
  .ui-pair figure { margin: 0; min-width: 0; }
  .ui-pair figcaption, .ui-cap { font-family: var(--mono); font-size: 11.5px; color: var(--muted); margin-bottom: 6px; }
  .ui-img img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  .ui-none { border: 1px dashed var(--line); border-radius: 6px; padding: 48px 12px; text-align: center; color: var(--faint); font-size: 12.5px; }
  .ui-slide { position: relative; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; user-select: none; background: #fff; }
  .ui-slide img { display: block; width: 100%; height: auto; }
  .ui-slide img.b { position: absolute; top: 0; left: 0; clip-path: inset(0 calc(100% - var(--split)) 0 0); }
  .ui-slide .ui-split { position: absolute; top: 0; bottom: 0; left: var(--split); width: 2px; background: var(--active); transform: translateX(-1px); pointer-events: none; }
  .ui-slide input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
  .ui-cap { display: flex; justify-content: space-between; }
  .files .file .v.todo { background: var(--human); }
  .art.vid-art { color: var(--active); }
  .vid-player { display: block; width: 100%; max-height: 70vh; background: #000; border: 1px solid var(--line); border-radius: 6px; }
  .vid-sheet { margin-top: 16px; }
  .vid-sheet img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 6px; }

  footer { padding: 0 32px 28px; font-family: var(--mono); font-size: 11px; color: var(--faint); display: flex; gap: 20px; flex-wrap: wrap; }

  @media (max-width: 640px) {
    header { padding: 18px 16px 4px; }
    .banner { margin: 12px 16px 0; }
    .overview { padding: 10px 16px 0; }
    .board { grid-template-columns: 1fr; padding: 16px 16px 32px; overflow-x: visible; }
    .graph-wrap { margin: 14px 16px 24px; height: 70vh; }
    .legend, .graph-hint { display: none; }
    footer { padding: 0 16px 24px; }
    .run-btn { max-width: calc(100vw - 32px); }
    .d-head { padding: 16px; }
    .d-body { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .files { border-right: 0; border-bottom: 1px solid var(--line); display: flex; gap: 4px; overflow-x: auto; padding: 8px; }
    .files .group { display: none; }
    .file { width: auto; white-space: nowrap; }
    .file .rn { display: inline; white-space: pre; }
    .doc { padding: 18px 16px 48px; }
    .ui-pair { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1 id="title">Workflow board</h1>
    <span id="run-state"></span>
  </div>
  <div class="right">
    <div class="status" id="status">connecting…</div>
    <button class="run-btn" id="run-btn" aria-haspopup="listbox" aria-expanded="false" title="Switch workflow run (R)">
      <span class="sdot" id="run-btn-dot"></span><span class="rn" id="run-btn-name">Select a run</span><span class="kbd">R</span><span aria-hidden="true">▾</span>
    </button>
    <div class="pop" id="run-pop" hidden>
      <input id="run-q" placeholder="Filter runs…" autocomplete="off" aria-label="Filter runs">
      <div class="pop-list" id="run-list" role="listbox"></div>
    </div>
  </div>
</header>
<div id="banner"></div>
<section class="overview">
  <div class="bar" id="progress" title=""></div>
  <div class="stats" id="stats"></div>
  <div class="now" id="now"></div>
  <div class="toolbar">
    <div class="filters" id="filters"></div>
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
      <label class="toggle"><input type="checkbox" id="collapse"> Collapse completed</label>
      <div class="seg" role="tablist">
        <button data-view="board" title="Board (B)">▤ Board</button>
        <button data-view="graph" title="Dependency graph (G)">⟜ Graph</button>
      </div>
    </div>
  </div>
  <div class="arts" id="arts"></div>
</section>
<main class="board" id="board"></main>
<div class="graph-wrap" id="graph" hidden>
  <div class="gctl">
    <button data-zoom="in" title="Zoom in">+</button>
    <button data-zoom="out" title="Zoom out">−</button>
    <button data-zoom="fit" class="wide" title="Fit to view (F)">Fit</button>
    <button data-zoom="live" class="wide" title="Center on what is running">● Live</button>
  </div>
  <div class="stage" id="stage"></div>
  <div class="legend">
    <span><span class="ln"></span>waiting</span>
    <span><span class="ln ready"></span>parent completed</span>
    <span><span class="ln flow"></span>running now</span>

</div>

  <span>Cost is API-equivalent at list prices.</span>

    </div>

      <article class="doc"><div class="md" id="d-doc"></div></article>
    </div>

<script>
const POLL_MS = 2000
const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const store = {
  get(k, d) { try { const v = localStorage.getItem('wfboard.' + k); return v === null ? d : JSON.parse(v) } catch { return d } },
  set(k, v) { try { localStorage.setItem('wfboard.' + k, JSON.stringify(v)) } catch {} },
}

let state = null
let runId = (() => { try { return localStorage.getItem('wfboard.run') } catch { return null } })()
const prefs = { view: store.get('view', 'board'), collapse: store.get('collapse', true), filter: 'all' }
let model = null       // dependency graph of the current run
let lastBoard = '', lastGraph = '', lastNow = ''
let open = null        // { kind: 'group', id } | { kind: 'artifact', path, name }
let openFile = null
let openText

// wfboard.py --snapshot inlines every file as window.BOARD_SNAPSHOT (a cloud session has no localhost to poll).
const SNAP = window.BOARD_SNAPSHOT || null

async function fetchText(url) {
  if (SNAP) {
    if (url in SNAP.files) return SNAP.files[url]
    throw new Error(`${url}: not in this snapshot`)
  }
  const res = await fetch(url, { cache: 'no-store' })
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`)
  return res.text()
}

function dur(sec) {
  const m = Math.max(0, Math.floor((sec || 0) / 60))
  if (m < 1) return `${Math.max(0, Math.floor(sec || 0))}s`
  return m >= 60 ? `${Math.floor(m / 60)}h${String(m % 60).padStart(2, '0')}m` : `${m}m`
}
function ago(t) {
  if (!t) return ''
  const s = Date.now() / 1000 - t
  if (s < 60) return 'just now'
  if (s < 3600) return `${Math.floor(s / 60)}m ago`
  if (s < 86400) return `${Math.floor(s / 3600)}h ago`
  return `${Math.floor(s / 86400)}d ago`
}
const money = (n) => `$${Number(n || 0).toFixed(2)}`

// ---- Status categories ---------------------------------------------------

const CATS = ['running', 'wait', 'issue', 'done', 'queued', 'skipped']
const CAT_LABEL = { running: 'Running', wait: 'Your turn', issue: 'Needs a look', done: 'Completed', queued: 'Queued', skipped: 'Skipped' }
function cat(g) {
  if (g.running || g.status === 'RUN') return 'running'
  if (g.status === 'WAIT') return 'wait'
  if (['PASS', 'DONE'].includes(g.status)) return 'done'
  if (['FAIL', 'CHANGES'].includes(g.status)) return 'issue'
  if (g.status === 'TODO') return 'queued'
  return 'skipped'
}
const BADGE = {
  running: () => '<span class="badge running"><span class="pulse"></span>running</span>',
  wait: () => '<span class="badge wait">your turn</span>',
  done: (g) => `<span class="badge done">✓ ${g.status === 'PASS' ? 'passed' : 'completed'}</span>`,
  issue: (g) => g.status === 'FAIL' ? '<span class="badge fail">✕ failed</span>' : '<span class="badge issue">changes</span>',
  queued: () => '<span class="badge queued">queued</span>',
  skipped: (g) => `<span class="badge skipped">${g.status === 'SKIP' ? 'not run' : 'stopped'}</span>`,
}
const NODE_ST = { running: '● running', wait: '◆ your turn', done: '✓ done', queued: 'queued', skipped: 'skipped' }

function runCat(r) {
  const s = (r.state || '').split(' ')[0]
  return s === 'waiting' ? 'waiting' : s
}
const ACTIVE_RUN = new Set(['running', 'between', 'waiting'])

function counts(groups) {
  const c = Object.fromEntries(CATS.map((k) => [k, 0]))
  for (const g of groups) c[cat(g)]++
  return c
}
function barHtml(c, total) {
  if (!total) return ''
  return CATS.filter((k) => c[k]).map((k) =>
    `<i class="${k}" style="width:${(100 * c[k] / total).toFixed(2)}%" title="${c[k]} ${CAT_LABEL[k].toLowerCase()}"></i>`).join('')
}

function currentRun() {
  if (!state?.runs?.length) return null
  return state.runs.find((r) => r.id === runId) || state.runs[0]
}
const realGroups = (run) => run.groups.filter((g) => g.id !== 'Orchestrator/main')

// ---- Dependency model ------------------------------------------------------
// Edges come from explicit deps (ticket depends_on, or "deps" in a pipeline manifest). Any group without
// explicit deps is linked to the last groups of the phase before it; when both sides have several groups
// the link goes through a small "phase handoff" node instead of an all-to-all mesh.

function buildModel(run) {
  const gs = realGroups(run)
  const byId = new Map(gs.map((g) => [g.id, g]))
  const resolve = (d) => byId.get(d) || gs.find((g) => g.key === d) || gs.find((g) => g.num === d)
  const parents = new Map(gs.map((g) => [g.id, new Set()]))
  for (const g of gs) for (const d of g.deps || []) {
    const p = resolve(d)
    if (p && p.id !== g.id) parents.get(g.id).add(p.id)
  }
  // Transitive reduction: drop A→C when C also depends on B and B already (indirectly) depends on A.
  const anc = new Map()
  const ancestors = (id, seen = new Set()) => {
    if (anc.has(id)) return anc.get(id)
    if (seen.has(id)) return new Set()
    seen.add(id)
    const out = new Set()
    for (const p of parents.get(id) || []) { out.add(p); for (const a of ancestors(p, seen)) out.add(a) }
    anc.set(id, out)
    return out
  }
  for (const [id, ps] of parents) {
    const keep = [...ps].filter((p) => ![...ps].some((q) => q !== p && ancestors(q).has(p)))
    if (keep.length !== ps.size) parents.set(id, new Set(keep))
  }
  const explicit = new Map([...parents].map(([k, v]) => [k, new Set(v)]))
  const phases = (run.phases.length ? run.phases : [...new Set(gs.map((g) => g.phase))]).filter((p) => gs.some((g) => g.phase === p))
  const gates = []
  let prev = null
  for (const p of phases) {
    const here = gs.filter((g) => g.phase === p)
    if (prev) {
      const usedInside = new Set(prev.flatMap((g) => [...explicit.get(g.id)]))
      const sinks = prev.filter((g) => !usedInside.has(g.id))
      const roots = here.filter((g) => !explicit.get(g.id).size)
      if (sinks.length > 1 && roots.length > 1) {
        const id = `gate:${p}`
        gates.push({ id, phase: p, gate: true, from: sinks.map((g) => g.id) })
        parents.set(id, new Set(sinks.map((g) => g.id)))
        for (const r of roots) parents.get(r.id).add(id)
      } else {
        for (const r of roots) for (const s of sinks) parents.get(r.id).add(s.id)
      }
    }
    prev = here
  }
  const children = new Map([...parents.keys()].map((k) => [k, new Set()]))
  for (const [c, ps] of parents) for (const p of ps) children.get(p)?.add(c)
  // Real (non-gate) neighbours, for the drawer and cards.
  const realOf = (ids, map) => {
    const out = new Set()
    const walk = (id) => { for (const x of map.get(id) || []) x.startsWith('gate:') ? walk(x) : out.add(x) }
    for (const id of ids) walk(id)
    return [...out]
  }
  return { gs, byId, parents, children, gates, phases, explicit,
    up: (id) => realOf([id], parents), down: (id) => realOf([id], children) }
}

// ---- Run picker -------------------------------------------------------------

let popIndex = -1
function runRows() {
  const q = $('run-q').value.trim().toLowerCase()
  const runs = (state?.runs || []).filter((r) => !q || `${r.name} ${r.id} ${r.state}`.toLowerCase().includes(q))
  const byTime = (a, b) => (b.updated || 0) - (a.updated || 0)
  const live = runs.filter((r) => ACTIVE_RUN.has(runCat(r))).sort(byTime)
  const rest = runs.filter((r) => !ACTIVE_RUN.has(runCat(r))).sort(byTime)
  return { live, rest }
}
function renderRunPicker() {
  const run = currentRun()
  if (run) {
    $('run-btn-name').textContent = run.name
    $('run-btn-dot').className = `sdot ${runCat(run)}`
  }
  if ($('run-pop').hidden) return
  const { live, rest } = runRows()
  const row = (r) => {
    const gs = realGroups(r), c = counts(gs)
    return `<button class="run-row ${run && r.id === run.id ? 'on' : ''}" role="option" data-run="${esc(r.id)}">
      <span class="sdot ${runCat(r)}"></span><span class="nm">${esc(r.name)}</span><span class="ago">${esc(ago(r.updated))}</span>
      <span class="sub"><span class="state ${runCat(r)}">${esc(r.state)}</span><span>${c.done}/${gs.length} done</span><span class="bar">${barHtml(c, gs.length)}</span><span>${money(r.cost)}</span></span>
    </button>`
  }
  const html = (live.length ? `<div class="pop-sec">Active now · ${live.length}</div>${live.map(row).join('')}` : '')
    + (rest.length ? `<div class="pop-sec">Earlier</div>${rest.map(row).join('')}` : '')
  $('run-list').innerHTML = html || '<div class="pop-empty">No runs match.</div>'
  markKb()
}
function markKb() {
  const rows = [...$('run-list').querySelectorAll('.run-row')]
  rows.forEach((r, i) => r.classList.toggle('kb', i === popIndex))
  rows[popIndex]?.scrollIntoView({ block: 'nearest' })
}
function openPop() {
  $('run-pop').hidden = false
  $('run-btn').setAttribute('aria-expanded', 'true')
  $('run-q').value = ''
  popIndex = -1
  renderRunPicker()
  $('run-q').focus()
}
function closePop() { $('run-pop').hidden = true; $('run-btn').setAttribute('aria-expanded', 'false') }
function selectRun(id) {
  runId = id
  try { localStorage.setItem('wfboard.run', runId) } catch {}
  lastBoard = lastGraph = lastNow = ''
  prefs.filter = 'all'
  fitPending = true
  closePop()
  closeDrawer()
  render()
}

// ---- Board ------------------------------------------------------------------

const CHIP = { RUN: 'wait RUN', PASS: 'PASS', CHANGES: 'CHANGES', FAIL: 'FAIL', DONE: 'DONE', STOPPED: 'STOPPED',
  WAIT: 'wait WAIT', TODO: 'TODO', SKIP: 'STOPPED' }
const STATUS_WORD = { RUN: 'running', PASS: 'pass', CHANGES: 'changes', FAIL: 'failed', DONE: 'done', STOPPED: 'stopped',
  WAIT: 'waiting on owner', TODO: 'not started', SKIP: 'not run' }

function depChips(ids, button) {
  return ids.map((id) => {
    const g = model.byId.get(id)
    if (!g) return ''
    const c = cat(g)
    const mark = c === 'done' ? '✓ ' : c === 'running' ? '● ' : ''
    return button
      ? `<button class="dep ${c}" data-group="${esc(id)}" title="${esc(g.title)}">${mark}${esc(g.num)}</button>`
      : `<span class="dep ${c}" title="${esc(g.title)} · ${esc(CAT_LABEL[c])}">${mark}${esc(g.num)}</span>`
  }).join('')
}

function card(g) {
  const c = cat(g)
  if (prefs.collapse && c === 'done') {
    return `<article class="card mini done" data-group="${esc(g.id)}" tabindex="0" title="${esc(g.title)} · completed">
      <span class="tick">✓</span><span class="num">${esc(g.num)}</span><span class="t">${esc(g.title)}</span><span class="el">${dur(g.elapsed)}</span></article>`
  }
  const models = [...new Set(g.agents.map((a) => a.model))].join('/')
  const steps = g.agents.length > 1 || g.phase === 'Implement' || g.phase === 'Approve'
    ? `<div class="steps">${g.agents.map((a) =>
        `<span class="chip ${CHIP[a.status] || 'bad'}" title="${esc(a.label)} · ${esc(a.model)} · ${esc(STATUS_WORD[a.status] || a.status)}">${esc(a.step)}</span>`).join('')}</div>`
    : ''
  const exp = [...(model.explicit.get(g.id) || [])]
  const deps = exp.length ? `<div class="deps">after ${depChips(exp)}</div>` : ''
  return `
    <article class="card ${c} ${g.status === 'FAIL' ? 'fail' : ''}" data-group="${esc(g.id)}" tabindex="0">
      <div class="card-top"><span class="num">${esc(g.num)}</span>${BADGE[c](g)}</div>
      <p class="feature">${esc(g.title)}</p>
      ${g.last && c !== 'done' ? `<div class="last">${esc(g.last)}</div>` : ''}
      ${deps}
      ${steps}
      <div class="meta"><span>${esc(models)}</span><span>${money(g.cost)}</span><span>${dur(g.elapsed)}</span></div>
    </article>`
}

function renderBoard(run) {
  const groups = run.groups
  const cols = run.phases.length ? run.phases : [...new Set(groups.map((g) => g.phase))]
  const html = cols.map((p, i) => {
    const gs = groups.filter((g) => g.phase === p)
    const shown = gs.filter((g) => prefs.filter === 'all' || cat(g) === prefs.filter)
    // Running first, then needs-attention, then the rest in their natural order.
    const order = { running: 0, wait: 1, issue: 2, queued: 3, done: 4, skipped: 5 }
    const sorted = shown.map((g, n) => [g, n]).sort((a, b) =>
      prefs.collapse ? (order[cat(a[0])] - order[cat(b[0])]) || a[1] - b[1] : a[1] - b[1]).map((x) => x[0])
    const c = counts(gs)
    const models = [...new Set(gs.flatMap((g) => g.agents.map((a) => a.model)))].filter((m) => m !== 'queued').join(' · ')
    const allDone = gs.length && c.done + c.skipped === gs.length
    const cls = c.running ? 'live' : allDone ? 'all-done' : gs.length ? '' : 'pending'
    const count = !gs.length ? '' : allDone ? '✓ all done' : `${c.done}/${gs.length}${c.running ? ' · ' + c.running + ' running' : ''}`
    return `
      <section class="col ${cls}">
        <div class="col-head">
          <h2>${esc(p)}</h2><span class="who">${esc(models || (i === 0 ? '' : 'not started'))}</span>
          <span class="count">${count}</span>
        </div>
        ${sorted.map(card).join('') || `<div class="empty">${gs.length ? 'nothing ' + esc(CAT_LABEL[prefs.filter]?.toLowerCase() || '') : '—'}</div>`}
      </section>`
  }).join('')
  $('board').style.setProperty('--cols', String(cols.length || 1))
  if (html !== lastBoard) { lastBoard = html; $('board').innerHTML = html }
}

// ---- Graph ------------------------------------------------------------------

const NW = 214, NH = 64, GW = 22, VGAP = 16, HGAP = 70, PAD = 40
let view = { x: 0, y: 0, k: 1 }
let fitPending = true
let layout = null
let hoverId = null

function layoutGraph(m) {
  const ids = [...m.parents.keys()]
  if (!ids.length) return { pos: new Map(), W: 2 * PAD, H: 2 * PAD, layers: [] }
  const depth = new Map()
  const visiting = new Set()
  const d = (id) => {
    if (depth.has(id)) return depth.get(id)
    if (visiting.has(id)) return 0   // cycle guard
    visiting.add(id)
    let v = 0
    for (const p of m.parents.get(id) || []) v = Math.max(v, d(p) + 1)
    visiting.delete(id)
    depth.set(id, v)
    return v
  }
  ids.forEach(d)
  const layers = []
  ids.forEach((id) => (layers[depth.get(id)] ||= []).push(id))
  const isGate = (id) => id.startsWith('gate:')
  const h = (id) => isGate(id) ? GW : NH
  const w = (id) => isGate(id) ? GW : NW
  const pos = new Map()
  let x = PAD
  layers.forEach((layer, li) => {
    const lw = Math.max(...layer.map(w))
    // Order by where the parents sit, then pack top to bottom without overlap.
    const want = new Map(layer.map((id, n) => {
      const ps = [...(m.parents.get(id) || [])].map((p) => pos.get(p)).filter(Boolean)
      return [id, ps.length ? ps.reduce((s, p) => s + p.cy, 0) / ps.length : null]
    }))
    const items = layer.map((id, n) => ({ id, n, want: want.get(id) }))
    if (li > 0) items.sort((a, b) => (a.want ?? 1e9) - (b.want ?? 1e9) || a.n - b.n)
    let cur = -Infinity
    for (const it of items) {
      const top = it.want == null ? cur : Math.max(it.want - h(it.id) / 2, cur)
      it.y = top === -Infinity ? 0 : top
      cur = it.y + h(it.id) + VGAP
    }
    const anchored = items.filter((it) => it.want != null)
    if (anchored.length) {
      const shift = anchored.reduce((s, it) => s + (it.want - (it.y + h(it.id) / 2)), 0) / anchored.length
      items.forEach((it) => { it.y += shift })
    }
    for (const it of items) pos.set(it.id, { x: x + (lw - w(it.id)) / 2, y: it.y, w: w(it.id), h: h(it.id), cy: it.y + h(it.id) / 2, layer: li })
    x += lw + HGAP
  })
  const minY = Math.min(...[...pos.values()].map((p) => p.y))
  for (const p of pos.values()) { p.y += PAD + 24 - minY; p.cy += PAD + 24 - minY }
  const W = x - HGAP + PAD
  const H = Math.max(...[...pos.values()].map((p) => p.y + p.h)) + PAD
  return { pos, W, H, layers }
}

function edgeClass(m, from, to) {
  const tg = m.byId.get(to)
  const st = (id) => id.startsWith('gate:') ? gateState(m, id) : cat(m.byId.get(id))
  const finished = (c) => c === 'done' || c === 'skipped' || c === 'issue'
  const s = st(from), t = tg ? cat(tg) : gateState(m, to)
  if (t === 'running' || t === 'live') return 'flow'
  if (finished(s) && finished(t)) return 'done'
  if (finished(s)) return 'ready'
  return 'blocked'
}
function gateState(m, id) {
  const ps = [...m.parents.get(id)].map((p) => cat(m.byId.get(p)))
  if (ps.every((c) => c === 'done' || c === 'skipped' || c === 'issue')) return 'done'
  if (ps.some((c) => c === 'running')) return 'live'
  return ''
}

function renderGraph(run) {
  const m = model
  layout = layoutGraph(m)
  const { pos, W, H } = layout
  let edges = ''
  for (const [to, ps] of m.parents) for (const from of ps) {
    const a = pos.get(from), b = pos.get(to)
    if (!a || !b) continue
    const x1 = a.x + a.w, y1 = a.cy, x2 = b.x - 4, y2 = b.cy
    const dx = Math.max(30, (x2 - x1) / 2)
    const cls = edgeClass(m, from, to)
    edges += `<path class="edge ${cls}" data-from="${esc(from)}" data-to="${esc(to)}" marker-end="url(#ah-${cls})"
      d="M${x1},${y1} C${x1 + dx},${y1} ${x2 - dx},${y2} ${x2},${y2}"/>`
  }
  const markers = ['blocked', 'done', 'ready', 'flow'].map((c) =>
    `<marker id="ah-${c}" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path class="ah ${c === 'blocked' ? '' : c}" d="M0,0 L8,4 L0,8 z"/></marker>`).join('')

  // Phase labels above the first node of each phase (by left-most position).
  const phaseX = new Map()
  for (const g of m.gs) {
    const p = pos.get(g.id)
    if (p && (!phaseX.has(g.phase) || p.x < phaseX.get(g.phase).x)) phaseX.set(g.phase, p)
  }
  const labels = [...phaseX].map(([ph, p]) => {
    const gs = m.gs.filter((g) => g.phase === ph), c = counts(gs)
    const cls = c.running ? 'live' : c.done + c.skipped === gs.length ? 'done' : ''
    return `<div class="phase-lbl ${cls}" style="left:${p.x}px;top:${PAD - 14}px">${esc(ph)} ${cls === 'done' ? '✓' : `${c.done}/${gs.length}`}</div>`
  }).join('')

  const nodes = m.gs.map((g) => {
    const p = pos.get(g.id), c = cat(g)
    const st = c === 'issue' ? (g.status === 'FAIL' ? '✕ failed' : '△ changes') : NODE_ST[c]
    const extra = c === 'running' ? ` ${dur(g.elapsed)}` : ''
    const match = prefs.filter === 'all' || prefs.filter === c ? '' : 'nomatch'
    return `<div class="node ${c} ${g.status === 'FAIL' ? 'fail' : ''} ${match}" data-group="${esc(g.id)}" data-node="${esc(g.id)}" tabindex="0"
      style="left:${p.x}px;top:${p.y}px" title="${esc(g.title)}">
      <div class="nh"><span class="num">${esc(g.phase === 'Implement' ? g.num : g.num + ' · ' + g.phase)}</span><span class="st">${st}${extra}</span></div>
      <div class="nt">${esc(g.title)}</div></div>`
  }).join('')
  const gates = m.gates.map((gt) => {
    const p = pos.get(gt.id), s = gateState(m, gt.id)
    return `<div class="gate ${s}" data-node="${esc(gt.id)}" style="left:${p.x}px;top:${p.y}px"
      title="${esc(gt.phase)} starts when ${gt.from.length} parents finish">${s === 'done' ? '✓' : '◯'}</div>`
  }).join('')

  const html = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}"><defs>${markers}</defs>${edges}</svg>${labels}${gates}${nodes}`
  const wrap = $('graph')
  wrap.classList.toggle('dim-filter', prefs.filter !== 'all')
  if (html !== lastGraph) {
    lastGraph = html
    $('stage').innerHTML = html
    $('stage').style.width = W + 'px'
    $('stage').style.height = H + 'px'
    if (hoverId) highlight(hoverId)
  }
  if (fitPending && !wrap.hidden && wrap.clientWidth) { fitPending = false; fit() }
}

function applyView() { $('stage').style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})` }
function fit() {
  if (!layout) return
  const wrap = $('graph')
  const k = Math.min(1.1, Math.max(0.25, Math.min((wrap.clientWidth - 20) / layout.W, (wrap.clientHeight - 20) / layout.H)))
  view = { k, x: (wrap.clientWidth - layout.W * k) / 2, y: Math.max(10, (wrap.clientHeight - layout.H * k) / 2) }
  applyView()
}
function zoomAt(f, cx, cy) {
  const k = Math.min(2.5, Math.max(0.15, view.k * f))
  view.x = cx - (cx - view.x) * (k / view.k)
  view.y = cy - (cy - view.y) * (k / view.k)
  view.k = k
  applyView()
}
function centerLive() {
  const run = currentRun()
  if (!run || !layout) return
  const target = run.groups.find((g) => cat(g) === 'running') || run.groups.find((g) => cat(g) === 'wait')
    || run.groups.find((g) => cat(g) === 'queued')
  const p = target && layout.pos.get(target.id)
  if (!p) return fit()
  const wrap = $('graph')
  view.k = Math.max(view.k, 0.9)
  view.x = wrap.clientWidth / 2 - (p.x + p.w / 2) * view.k
  view.y = wrap.clientHeight / 2 - p.cy * view.k
  applyView()
}

function lineage(id) {
  const out = new Set([id])
  const walk = (x, map) => { for (const y of map.get(x) || []) if (!out.has(y)) { out.add(y); walk(y, map) } }
  walk(id, model.parents)
  const up = new Set(out)
  out.clear(); out.add(id)
  walk(id, model.children)
  for (const x of up) out.add(x)
  return out
}
function highlight(id) {
  const wrap = $('graph')
  wrap.querySelectorAll('.on-path, .focus').forEach((el) => el.classList.remove('on-path', 'focus'))
  if (!id || !model?.parents.has(id)) { wrap.classList.remove('hl'); return }
  const set = lineage(id)
  wrap.classList.add('hl')
  wrap.querySelectorAll('[data-node]').forEach((el) => { if (set.has(el.dataset.node)) el.classList.add('on-path') })
  wrap.querySelector(`[data-node="${CSS.escape(id)}"]`)?.classList.add('focus')
  wrap.querySelectorAll('.edge').forEach((el) => { if (set.has(el.dataset.from) && set.has(el.dataset.to)) el.classList.add('on-path') })
}

// ---- Overview ---------------------------------------------------------------

function renderOverview(run) {
  const gs = realGroups(run)
  const c = counts(gs)
  const total = gs.length
  $('progress').innerHTML = barHtml(c, total)
  $('progress').title = CATS.filter((k) => c[k]).map((k) => `${c[k]} ${CAT_LABEL[k].toLowerCase()}`).join(' · ')
  const pct = total ? Math.round(100 * (c.done + c.skipped) / total) : 0
  $('stats').innerHTML = [
    `<span><b class="pct">${pct}%</b> · <b>${c.done}</b>/${total} completed</span>`,
    `<span><b>${run.agents}</b> agents${run.running ? ` · <b style="color:var(--active)">${run.running}</b> running` : ''}</span>`,
    `<span><b>${money(run.cost)}</b> API-equivalent</span>`,
    `<span><b>${dur(run.elapsed)}</b> elapsed</span>`,
    run.updated ? `<span>last activity ${ago(run.updated)}</span>` : '',
  ].join('')

  const live = gs.filter((g) => cat(g) === 'running')
  const waiting = gs.filter((g) => cat(g) === 'wait')
  const rc = runCat(run)
  let now
  if (live.length || waiting.length) {
    const item = (g) => {
      const c2 = cat(g)
      return `<button class="now-item" data-group="${esc(g.id)}">
        ${c2 === 'running' ? '<span class="pulse"></span>' : '<span class="sw wait" style="width:8px;height:8px;border-radius:50%"></span>'}
        <span class="t"><span class="num" ${c2 === 'wait' ? 'style="color:var(--human)"' : ''}>${esc(g.num)}</span> ${esc(g.title)}</span>
        <span class="el">${c2 === 'running' ? dur(g.elapsed) : 'your turn'}</span>
        ${g.last ? `<span class="ln">${esc(g.last)}</span>` : ''}</button>`
    }
    const lbl = live.length ? `<span class="lbl"><span class="pulse"></span>Running now · ${live.length}</span>` : '<span class="lbl">Your turn</span>'
    now = `<div class="now ${live.length ? '' : 'your-turn'}">${lbl}${[...waiting, ...live].map(item).join('')}</div>`
  } else if (rc === 'finished' || rc === 'completed') {
    now = `<div class="now done-run"><span class="lbl">✓ Run ${esc(rc)}</span><span class="msg">Nothing running. ${c.done} of ${total} steps completed${c.issue ? `, ${c.issue} need a look` : ''}.</span></div>`
  } else {
    const next = gs.filter((g) => cat(g) === 'queued').slice(0, 3)
    now = `<div class="now quiet"><span class="lbl">Nothing running</span><span class="msg">${esc(run.state)}${next.length ? ' · next: ' + next.map((g) => esc(g.num)).join(', ') : ''}</span></div>`
  }
  if (now !== lastNow) { lastNow = now; $('now').outerHTML = now.replace('<div class="now', '<div id="now" class="now') }

  $('filters').innerHTML = [`<button class="fchip ${prefs.filter === 'all' ? 'on' : ''}" data-filter="all">All <span class="n">${total}</span></button>`]
    .concat(CATS.filter((k) => c[k]).map((k) =>
      `<button class="fchip ${prefs.filter === k ? 'on' : ''}" data-filter="${k}"><span class="sw ${k}"></span>${CAT_LABEL[k]} <span class="n">${c[k]}</span></button>`)).join('')
  $('collapse').checked = prefs.collapse
  document.querySelectorAll('[data-view]').forEach((b) => b.classList.toggle('on', b.dataset.view === prefs.view))
  $('arts').innerHTML = uiButton(run) + videoButton(run) + (run.artifacts || []).map((a) =>
    `<button class="art" data-art="${esc(a.path)}" data-name="${esc(a.name)}" title="${esc(a.source)}">${esc(a.name)}</button>`).join('')
  $('banner').innerHTML = run.error ? `<div class="banner">${esc(run.error)}</div>` : ''
}

function render() {
  renderRunPicker()
  const run = currentRun()
  if (!run) {
    $('board').innerHTML = '<div class="empty">No workflow runs found yet.</div>'
    return
  }
  $('title').textContent = run.name
  $('run-state').innerHTML = `<span class="state ${esc(runCat(run))}">${esc(run.state)}</span>`
  document.title = `${run.running ? '● ' : ''}${run.name} · Workflow board`
  model = buildModel(run)
  renderOverview(run)
  const graph = prefs.view === 'graph'
  $('board').hidden = graph
  $('graph').hidden = !graph
  if (graph) renderGraph(run)
  else renderBoard(run)
}

async function poll() {
  const status = $('status')
  try {
    state = JSON.parse(await fetchText('data/state.json'))
    if (state.error) throw new Error(state.error)
    render()
    if (open) await refreshDrawer()
    status.className = 'status'
    status.innerHTML = SNAP
      ? `<span class="dot"></span>snapshot · ${esc(new Date((SNAP.generated || 0) * 1000).toLocaleString())}`
      : `<span class="dot"></span>live · ${new Date().toLocaleTimeString()}`
  } catch (err) {
    status.className = 'status error'
    status.innerHTML = `<span class="dot"></span>${esc(err.message)}`
  }
}

// ---- UI before / after ---------------------------------------------------
// run.ui comes from wfboard.export_ui(): screenshots from the skill's ui-snap tool, verdicts from .agent/ui/review.json.

const UI_STATUS = { changed: 'changed', new: 'new page', removed: 'removed', pending: 'no after yet', unchanged: 'unchanged' }
const UI_STATE_CLS = { changed: 'idle', new: 'running', removed: 'waiting', pending: 'between', unchanged: 'finished' }
const UI_TONE = { expected: 'good', unexpected: 'warn', broken: 'stop' }
const UI_ORDER = ['changed', 'new', 'removed', 'pending', 'unchanged']
let uiShot = null, uiMode = store.get('uimode', 'side'), uiSplit = 50, uiKey = ''

function uiCounts(ui) {
  const shots = ui.shots || []
  const moved = shots.filter((s) => ['changed', 'new', 'removed'].includes(s.status))
  return { total: shots.length, changed: moved.length, todo: moved.filter((s) => !s.verdict).length,
           flagged: shots.filter((s) => s.verdict === 'unexpected' || s.verdict === 'broken').length }
}

function uiButton(run) {
  if (!run.ui) return ''
  const c = uiCounts(run.ui)
  const bits = [`${c.changed} of ${c.total} changed`]
  if (c.flagged) bits.push(`${c.flagged} flagged`)
  if (c.todo) bits.push(`${c.todo} to review`)
  const cls = c.flagged ? 'warn' : c.todo ? 'todo' : run.ui.verdict === 'PASS' ? 'good' : ''
  return `<button class="art ui-art ${cls}" data-ui="1" title="Before / after screenshots of every page this run touched">◐ UI before / after · ${bits.join(' · ')}</button>`
}

function uiImg(src, alt, empty) {
  return src ? `<a class="ui-img" href="${esc(src)}" target="_blank" rel="noopener"><img src="${esc(src)}" alt="${esc(alt)}" loading="lazy"></a>`
             : `<div class="ui-none">${esc(empty)}</div>`
}

function renderUi(run) {
  const ui = run.ui
  $('d-num').textContent = `${run.name} · UI verification`
  $('d-doc').className = 'uiv'
  if (!ui) {
    $('d-title').textContent = 'No screenshots yet'
    $('d-deps').innerHTML = ''
    $('d-files').innerHTML = ''
    $('d-doc').innerHTML = '<p class="ui-none">This run has no .agent/ui/shots.json yet. The before shots are taken after H1, before any code changes.</p>'
    uiKey = ''
    return
  }
  const r = ui.run || {}
  const commit = (p) => r[p] ? `<code>${esc(r[p].commit || '?')}</code>${r[p].dirty_files ? ` +${esc(r[p].dirty_files)} uncommitted` : ''}` : 'not taken'
  const shots = ui.shots || []
  if (!uiShot || !shots.some((s) => s.id === uiShot)) uiShot = (shots.find((s) => s.status !== 'unchanged') || shots[0] || {}).id
  const s = shots.find((x) => x.id === uiShot)
  const c = uiCounts(ui)
  $('d-title').textContent = `Before / after · ${c.changed} of ${c.total} changed`
  const vtone = ui.verdict === 'PASS' ? 'good' : ui.verdict ? 'warn' : ''
  $('d-deps').innerHTML = `<div><span class="k">before</span>${commit('before')}<span class="k" style="margin-left:14px">after</span>${commit('after')}</div>`
    + `<div><span class="k">review</span>${ui.verdict ? `<span class="verdict ${vtone}" style="margin:0 6px 0 0;padding:1px 7px">${esc(ui.verdict)}</span>${esc(ui.summary || '')}`
      : `not reviewed yet${c.todo ? ` · ${c.todo} changed shots wait for the UI review` : ''}`}</div>`

  // Shot list, grouped by status, changed first.
  let nav = ''
  for (const st of UI_ORDER) {
    const list = shots.filter((x) => x.status === st)
    if (!list.length) continue
    nav += `<div class="group">${esc(UI_STATUS[st])} · ${list.length}</div>` + list.map((x) => {
      const tone = UI_TONE[x.verdict] || (st !== 'unchanged' && st !== 'pending' ? 'todo' : '')
      return `<button class="file ${x.id === uiShot ? 'on' : ''}" data-shot="${esc(x.id)}" title="${esc(x.id)}">
        <span class="v ${tone}"></span>${esc(x.page)} <span style="color:var(--faint)">${esc(x.role)} · ${esc(x.viewport)}${x.theme !== 'light' ? ' · ' + esc(x.theme) : ''}</span></button>`
    }).join('')
  }

  let view = ''
  if (s) {
    const redirect = [['before', s.final_path_before], ['after', s.final_path_after]].filter(([, p]) => p && p !== s.page.split('?')[0])
    view += `<div class="ui-meta"><span class="state ${UI_STATE_CLS[s.status] || ''}">${esc(UI_STATUS[s.status] || s.status)}</span>
      <b>${esc(s.page)}</b><span>${esc(s.role)}</span><span>${esc(s.viewport)}</span><span>${esc(s.theme)}</span>
      ${s.changed_pct != null ? `<span>${esc(s.changed_pct)}% of pixels (${esc(s.changed_pixels)})</span>` : ''}${s.size_changed ? '<span>page size changed</span>' : ''}</div>`
    if (redirect.length) view += `<p class="ui-flag">⚠ Redirected: ${redirect.map(([p, to]) => `${p} → <code>${esc(to)}</code>`).join(', ')}</p>`
    if (s.verdict || s.note) view += `<p class="ui-note">${s.verdict ? `<span class="verdict ${UI_TONE[s.verdict] || ''}">${esc(s.verdict)}</span>` : ''}${esc(s.note || '')}</p>`
    const mode = uiMode === 'diff' && !s.diff ? 'side' : uiMode === 'slider' && !(s.before && s.after) ? 'side' : uiMode
    view += `<div class="seg ui-modes" role="tablist">
      <button data-uimode="side" class="${mode === 'side' ? 'on' : ''}">Side by side</button>
      <button data-uimode="slider" class="${mode === 'slider' ? 'on' : ''}" ${s.before && s.after ? '' : 'disabled'}>Slider</button>
      <button data-uimode="diff" class="${mode === 'diff' ? 'on' : ''}" ${s.diff ? '' : 'disabled'}>Diff</button></div>`
    if (mode === 'slider') {
      view += `<div class="ui-cap"><span>◀ before</span><span>after ▶</span></div>
        <div class="ui-slide" style="--split:@@SPLIT@@%"><img src="${esc(s.after)}" alt="after"><img class="b" src="${esc(s.before)}" alt="before">
        <span class="ui-split"></span><input type="range" min="0" max="100" value="@@SPLIT@@" aria-label="Before / after split"></div>`
    } else if (mode === 'diff') {
      view += `<div class="ui-cap"><span>red = pixels that changed</span></div>${uiImg(s.diff, 'diff', '')}`
    } else {
      view += `<div class="ui-pair">
        <figure><figcaption>Before · ${r.before ? esc(r.before.commit) : ''}</figcaption>${uiImg(s.before, 'before', 'No before: this page is new in this run.')}</figure>
        <figure><figcaption>After · ${r.after ? esc(r.after.commit) : ''}${s.marked && s.status === 'changed' ? ' · changed areas boxed' : ''}</figcaption>${uiImg(s.marked && s.status === 'changed' ? s.marked : s.after, 'after', s.status === 'removed' ? 'Removed: not captured after.' : 'Not captured yet.')}</figure></div>`
    }
  }
  const key = nav + '\u0000' + view + $('d-deps').innerHTML
  if (key === uiKey) return  // unchanged since the last poll: keep the slider and scroll where they are
  uiKey = key
  $('d-files').innerHTML = nav
  $('d-doc').innerHTML = view.replaceAll('@@SPLIT@@', String(uiSplit))
}

// ---- Videos (agent-browser recordings from agent QA) -------------------------

const VID_KIND = { demo: 'Demo (happy path)', qa: 'QA exploration', other: 'Other' }
let vidOpen = null, vidKey = ''

function videoButton(run) {
  const v = run.videos || []
  if (!v.length) return ''
  const demos = v.filter((x) => x.kind === 'demo').length
  return `<button class="art vid-art" data-videos="1" title="agent-browser recordings from agent QA">▶ Videos · ${v.length}${demos ? ` (${demos} demo)` : ''}</button>`
}

function renderVideos(run) {
  const v = run.videos || []
  $('d-num').textContent = `${run.name} · videos`
  $('d-doc').className = 'uiv'
  $('d-title').textContent = v.length ? `Agent QA recordings · ${v.length}` : 'No videos yet'
  $('d-deps').innerHTML = '<div><span class="k">source</span>agent-browser record · .agent/video/</div>'
  if (!vidOpen || !v.some((x) => x.name === vidOpen)) vidOpen = (v.find((x) => x.kind === 'demo') || v[0] || {}).name
  let nav = ''
  for (const k of ['demo', 'qa', 'other']) {
    const list = v.filter((x) => x.kind === k)
    if (!list.length) continue
    nav += `<div class="group">${esc(VID_KIND[k])}</div>` + list.map((x) =>
      `<button class="file ${x.name === vidOpen ? 'on' : ''}" data-video="${esc(x.name)}"><span class="v good"></span>${esc(x.role)} <span style="color:var(--faint)">${(x.bytes / 1048576).toFixed(1)} MB</span></button>`).join('')
  }
  const x = v.find((y) => y.name === vidOpen)
  const view = x ? `<div class="ui-meta"><b>${esc(x.role)}</b><span>${esc(VID_KIND[x.kind] || x.kind)}</span><span>${esc(x.name)}</span></div>
    ${x.src ? `<video class="vid-player" controls preload="metadata" src="${esc(x.src)}"></video>` : `<p class="ui-none">${esc(x.note || 'Video not available here.')}</p>`}
    ${x.sheet ? `<div class="vid-sheet"><div class="ui-cap"><span>contact sheet: the distinct moments in this take</span></div>${uiImg(x.sheet, 'contact sheet', '')}</div>` : ''}`
    : '<p class="ui-none">QA agents record here when video is on for the run.</p>'
  const key = nav + '\u0000' + view
  if (key === vidKey) return  // never re-render under a playing video
  vidKey = key
  $('d-files').innerHTML = nav
  $('d-doc').innerHTML = view
}

// ---- Drawer -----------------------------------------------------------------

function groupFiles(g) {
  const out = []
  for (const a of g.agents) {
    for (const f of ['result', 'activity', 'prompt']) {
      out.push({ group: `${a.step} · ${a.model} · ${STATUS_WORD[a.status] || a.status}`, name: f,
        path: `data/${currentRun().id}/agents/${a.id}/${f}.md`, status: a.status })
    }
  }
  return out
}

async function refreshDrawer() {
  const run = currentRun()
  if (!run) return
  if (open.kind === 'ui') return renderUi(run)
  if (open.kind === 'video') return renderVideos(run)
  $('d-doc').className = 'md'
  let files
  if (open.kind === 'artifact') {
    const a = (run.artifacts || []).find((x) => x.path === open.path)
    $('d-num').textContent = `${run.name} · artifact`
    $('d-title').textContent = a ? a.source : open.name
    $('d-deps').innerHTML = ''
    files = [{ group: 'Artifact', name: open.name, path: `data/${open.path}` }]
  } else {
    const g = run.groups.find((x) => x.id === open.id)
    if (!g) return
    const c = cat(g)
    $('d-num').innerHTML = `${esc(g.phase)} · ${esc(g.num)} · ${money(g.cost)} · ${dur(g.elapsed)} ${BADGE[c](g).replace('margin-left:auto', '')}`
    $('d-title').textContent = g.title
    const up = model?.parents.has(g.id) ? model.up(g.id) : []
    const down = model?.parents.has(g.id) ? model.down(g.id) : []
    $('d-deps').innerHTML = (up.length ? `<div><span class="k">after</span>${depChips(up, true)}</div>` : '')
      + (down.length ? `<div><span class="k">unblocks</span>${depChips(down, true)}</div>` : '')
    files = groupFiles(g)
  }
  if (!openFile || !files.some((f) => f.path === openFile)) {
    // Default: the latest agent's result (or activity while it is still running).
    const lastAgent = files.filter((f) => f.name === (files.at(-1)?.status === 'RUN' ? 'activity' : 'result')).at(-1)
    openFile = (lastAgent || files[0]).path
  }
  let group = null
  $('d-files').innerHTML = files.map((f) => {
    const head = f.group !== group ? `<div class="group">${esc(f.group)}</div>` : ''
    group = f.group
    const tone = f.status === 'FAIL' ? 'stop' : f.status === 'CHANGES' ? 'warn' : ['PASS', 'DONE'].includes(f.status) ? 'good' : ''
    return `${head}<button class="file ${f.path === openFile ? 'on' : ''}" data-file="${esc(f.path)}">
      <span class="v ${f.name === 'result' ? tone : ''}"></span>${esc(f.name)}</button>`
  }).join('')
  let text
  try { text = await fetchText(openFile) } catch (e) { text = `_${e.message}_` }
  if (text !== openText) {
    openText = text
    $('d-doc').innerHTML = markdown(text)
  }
}

async function openDrawer(o) {
  open = o
  uiKey = ''
  vidKey = ''
  document.body.classList.toggle('ui-open', o.kind === 'ui' || o.kind === 'video')
  openFile = null
  openText = undefined
  document.body.classList.add('open')
  $('d-doc').parentElement.scrollTop = 0
  await refreshDrawer()
}
function closeDrawer() { open = null; document.body.classList.remove('open', 'ui-open') }

// ---- Events -----------------------------------------------------------------

function setView(v) {
  prefs.view = v
  store.set('view', v)
  if (v === 'graph') fitPending = !layout || fitPending
  render()
  if (v === 'graph' && fitPending) { fitPending = false; fit() }
}

$('run-btn').addEventListener('click', (e) => { e.stopPropagation(); $('run-pop').hidden ? openPop() : closePop() })
$('run-q').addEventListener('input', () => { popIndex = 0; renderRunPicker() })
$('run-q').addEventListener('keydown', (e) => {
  const rows = [...$('run-list').querySelectorAll('.run-row')]
  if (e.key === 'ArrowDown') { e.preventDefault(); popIndex = Math.min(rows.length - 1, popIndex + 1); markKb() }
  else if (e.key === 'ArrowUp') { e.preventDefault(); popIndex = Math.max(0, popIndex - 1); markKb() }
  else if (e.key === 'Enter') { const r = rows[Math.max(0, popIndex)]; if (r) selectRun(r.dataset.run) }
  else if (e.key === 'Escape') { e.stopPropagation(); closePop(); $('run-btn').focus() }
})
$('collapse').addEventListener('change', (e) => { prefs.collapse = e.target.checked; store.set('collapse', prefs.collapse); render() })

document.addEventListener('click', (e) => {
  if (e.target.closest('a')) return
  if (!e.target.closest('#run-pop') && !$('run-pop').hidden) closePop()
  const run = e.target.closest('[data-run]')
  if (run) return selectRun(run.dataset.run)
  const v = e.target.closest('[data-view]')
  if (v) return setView(v.dataset.view)
  const fl = e.target.closest('[data-filter]')
  if (fl) { prefs.filter = prefs.filter === fl.dataset.filter ? 'all' : fl.dataset.filter; return render() }
  const z = e.target.closest('[data-zoom]')
  if (z) {
    const w = $('graph')
    if (z.dataset.zoom === 'fit') return fit()
    if (z.dataset.zoom === 'live') return centerLive()
    return zoomAt(z.dataset.zoom === 'in' ? 1.2 : 1 / 1.2, w.clientWidth / 2, w.clientHeight / 2)
  }
  if (dragMoved) return
  if (e.target.closest('[data-ui]')) return openDrawer({ kind: 'ui' })
  if (e.target.closest('[data-videos]')) return openDrawer({ kind: 'video' })
  const vd = e.target.closest('[data-video]')
  if (vd) { vidOpen = vd.dataset.video; vidKey = ''; return refreshDrawer() }
  const sh = e.target.closest('[data-shot]')
  if (sh) { uiShot = sh.dataset.shot; uiKey = ''; $('d-doc').parentElement.scrollTop = 0; return refreshDrawer() }
  const um = e.target.closest('[data-uimode]')
  if (um) { if (!um.disabled) { uiMode = um.dataset.uimode; store.set('uimode', uiMode); uiKey = ''; refreshDrawer() } return }
  const art = e.target.closest('[data-art]')
  if (art) return openDrawer({ kind: 'artifact', path: art.dataset.art, name: art.dataset.name })
  const c = e.target.closest('[data-group]')
  if (c) return openDrawer({ kind: 'group', id: c.dataset.group })
  const f = e.target.closest('[data-file]')
  if (f) { openFile = f.dataset.file; openText = undefined; $('d-doc').parentElement.scrollTop = 0; return refreshDrawer() }
  if (e.target.closest('[data-close]')) closeDrawer()
})
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') { if (!$('run-pop').hidden) return closePop(); return closeDrawer() }
  const typing = e.target.closest?.('input, textarea, select')
  const c = e.target.closest?.('[data-group]')
  if (c && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); return openDrawer({ kind: 'group', id: c.dataset.group }) }
  if (typing || e.metaKey || e.ctrlKey || e.altKey || document.body.classList.contains('open')) return
  const k = e.key.toLowerCase()
  if (k === 'r') { e.preventDefault(); openPop() }
  else if (k === 'b') setView('board')
  else if (k === 'g') setView('graph')
  else if (k === 'c') { prefs.collapse = !prefs.collapse; store.set('collapse', prefs.collapse); render() }
  else if (k === 'f' && prefs.view === 'graph') fit()
})

document.addEventListener('input', (e) => {
  if (!e.target.matches('.ui-slide input')) return
  uiSplit = Number(e.target.value)
  e.target.parentElement.style.setProperty('--split', uiSplit + '%')
})

// Graph pan / zoom / hover
let drag = null, dragMoved = false
const gw = $('graph')
gw.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.gctl') || e.button !== 0) return
  drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }
  dragMoved = false
})
window.addEventListener('pointermove', (e) => {
  if (!drag) return
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y
  if (!dragMoved && Math.hypot(dx, dy) < 4) return
  dragMoved = true
  gw.classList.add('dragging')
  view.x = drag.vx + dx
  view.y = drag.vy + dy
  applyView()
})
window.addEventListener('pointerup', () => {
  drag = null
  gw.classList.remove('dragging')
  setTimeout(() => { dragMoved = false }, 0)
})
gw.addEventListener('wheel', (e) => {
  e.preventDefault()
  const r = gw.getBoundingClientRect()
  zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX - r.left, e.clientY - r.top)
}, { passive: false })
gw.addEventListener('pointerover', (e) => {
  const n = e.target.closest('[data-node]')
  const id = n ? n.dataset.node : null
  if (id !== hoverId) { hoverId = id; highlight(id) }
})
gw.addEventListener('pointerleave', () => { hoverId = null; highlight(null) })
window.addEventListener('resize', () => { if (prefs.view === 'graph') fit() })

// ---- Markdown (from the factory dashboard) ------------------------------

function tone(first) {
  if (/^(VERDICT:\s*PASS|GATE:\s*PASS|APPROVE|STATUS:\s*READY|DECISION:\s*ACCEPT)$/.test(first)) return 'good'
  if (/^(VERDICT:\s*CHANGES|DECISION:\s*NEEDS-INFO)$/.test(first)) return 'warn'
  if (/^(ESCALATE|STATUS:\s*BLOCKED|GATE:\s*FAIL|DECISION:\s*REJECT)$/.test(first)) return 'stop'
  return null
}

function inline(s) {
  const codes = []
  s = esc(s).replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`)
  s = s
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(((?:https?:\/\/|\.{0,2}\/|#)[^)\s]*)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codes[i]}</code>`)
}

function markdown(src) {
  const lines = src.replace(/\r/g, '').split('\n')
  let i = 0
  let html = ''
  const first = (lines[0] || '').trim()
  const t = tone(first)
  if (t) {
    html += `<div class="verdict ${t}">${esc(first)}</div>`
    i = 1
    const extra = []
    while (i < lines.length && /^[A-Z-]+:\s/.test(lines[i])) extra.push(lines[i++])
    if (extra.length) html += `<div class="head">${esc(extra.join('\n'))}</div>`
  }

  const isList = (l) => /^\s*([-*+]|\d+\.)\s+/.test(l)
  const isBlockStart = (l) => /^(#{1,6}\s|```|\s*>|\|)/.test(l) || isList(l)

  while (i < lines.length) {
    const line = lines[i]
    if (!line.trim()) { i++; continue }

    if (line.startsWith('```')) {
      const body = []
      i++
      while (i < lines.length && !lines[i].startsWith('```')) body.push(lines[i++])
      i++
      html += `<pre><code>${esc(body.join('\n'))}</code></pre>`
      continue
    }
    const h = line.match(/^(#{1,6})\s+(.*)$/)
    if (h) { const n = Math.min(h[1].length, 4); html += `<h${n}>${inline(h[2])}</h${n}>`; i++; continue }

    if (/^\s*>/.test(line)) {
      const body = []
      while (i < lines.length && /^\s*>/.test(lines[i])) body.push(lines[i++].replace(/^\s*>\s?/, ''))
      html += `<blockquote>${markdown(body.join('\n'))}</blockquote>`
      continue
    }
    if (line.startsWith('|')) {
      const rows = []
      while (i < lines.length && lines[i].startsWith('|')) rows.push(lines[i++])
      const cells = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => inline(c.trim()))
      const body = rows.filter((r) => !/^\|[\s:|-]+\|$/.test(r))
      html += '<table>' + body.map((r, n) => `<tr>${cells(r).map((c) => n ? `<td>${c}</td>` : `<th>${c}</th>`).join('')}</tr>`).join('') + '</table>'
      continue
    }
    if (isList(line)) {
      const ordered = /^\s*\d+\./.test(line)
      const items = []
      while (i < lines.length && (isList(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const l = lines[i++]
        if (isList(l)) items.push({ indent: l.match(/^\s*/)[0].length, text: l.replace(/^\s*([-*+]|\d+\.)\s+/, '') })
        else items[items.length - 1].text += ' ' + l.trim()
      }
      const lis = items.map(({ indent, text }) => {
        const task = text.match(/^\[([ xX])\]\s+(.*)$/)
        const style = indent ? ` style="margin-left:${indent * 0.6}em"` : ''
        return task
          ? `<li class="task ${task[1] === ' ' ? '' : 'done'}"${style}>${inline(task[2])}</li>`
          : `<li${style}>${inline(text)}</li>`
      }).join('')
      html += ordered ? `<ol>${lis}</ol>` : `<ul>${lis}</ul>`
      continue
    }
    const para = []
    while (i < lines.length && lines[i].trim() && !isBlockStart(lines[i])) para.push(lines[i++])
    html += `<p>${inline(para.join(' '))}</p>`
  }
  return html
}

poll()
if (!SNAP) setInterval(poll, POLL_MS)
</script>
